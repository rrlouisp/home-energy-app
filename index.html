async function getAnswer(store_, key, params, keepMinutes) {
  const kept = store_[key];
  if (kept && Date.now() - kept.at < keepMinutes * 60000) return kept.answer;
  const answer = await ask(params);
  store_[key] = { at: Date.now(), answer };
  return answer;
}
function balanceRow(get, i) {
  const v = k => num(get[k] && get[k][i]);
  const solar = v("solar"), bought = v("bought"), sold = v("sold"), charged = v("charged"), gave = v("gave");
  if ([solar, bought, sold, charged, gave].some(x => x == null)) return null;
  return { solar, bought, sold, used: Math.max(0, solar + gave + bought - charged - sold) };
}
async function periodRows(period) {
  const today = londonDate(), month = today.slice(0, 7);
  const prevMonth = m => shiftDate(m + "-01", -1).slice(0, 7);
  if (period === "this_month" || period === "last_month") {
    const m = period === "this_month" ? month : prevMonth(month);
    // "so far" copies are kept apart, so a month fetched on its last day isn't reused once it's over
    const answer = await getAnswer(extra.months, m === month ? m + " so far" : m, { want: "month", date: m }, m === month ? 15 : 360);
    const count = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate();
    const rows = [];
    for (let i = 0; i < count; i++) {
      const date = `${m}-${String(i + 1).padStart(2, "0")}`;
      if (date >= today) break;
      const r = balanceRow(answer.days || {}, i);
      if (r) rows.push(Object.assign(r, { name: shortDate(date), tick: String(i + 1), every: 7 }));
    }
    return rows;
  }
  const year = +today.slice(0, 4);
  const [before, now] = await Promise.all([getAnswer(extra.years, String(year - 1), { want: "year", date: String(year - 1) }, 360),
                                           getAnswer(extra.years, year + " so far", { want: "year", date: String(year) }, 60)]);
  const rows = [];
  for (let back = 11; back >= 0; back--) {
    const d = new Date(Date.UTC(year, +month.slice(5, 7) - 1 - back, 1)), y = d.getUTCFullYear(), mi = d.getUTCMonth();
    const r = balanceRow(((y === year ? now : before) || {}).months || {}, mi);
    const name = d.toLocaleDateString("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
    if (r) rows.push(Object.assign(r, { name: back ? name : name + " so far", tick: d.toLocaleDateString("en-GB", { month: "narrow", timeZone: "UTC" }), every: 1 }));
  }
  return rows;
}

async function drawBars() {
  const box = document.getElementById("period-bars");
  if (!box) { bars = null; return; }
  const period = box.dataset.bars;
  let rows;
  try { rows = await periodRows(period); }
  catch (e) { if (box.isConnected) box.innerHTML = `<p class="fine">Couldn't get the chart: ${esc(message(e))}.</p>`; return; }
  if (!box.isConnected || !rows.length) { if (box.isConnected) box.innerHTML = ""; return; }
  const W = Math.floor(box.clientWidth);
  if (W < 120) return;
  const padL = 30, padR = 4, plotW = W - padL - padR, H = W < 520 ? 140 : 170, PT = 8, PB = 20;
  const peak = Math.max(...rows.map(r => r.used), 1), step = niceStep(peak), top = Math.ceil(peak / step) * step;
  const y = v => PT + (top - v) / top * H, slot = plotW / rows.length, bw = Math.max(3, Math.min(24, slot * 0.66));
  let svg = "";
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg += `<line class="${v ? "gl" : "zero"}" x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>` +
           `<text class="tick" x="${padL - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${Math.round(v * 10) / 10}</text>`;
  }
  const column = (x, top, bottom, round) => {
    const h = bottom - top;
    if (h <= 0.3) return "";
    const r = round ? Math.min(4, bw / 2, h) : 0, f = v => v.toFixed(1);
    return `M${f(x)},${f(bottom)}V${f(top + r)}` + (r ? `q0,${f(-r)} ${f(r)},${f(-r)}h${f(bw - 2 * r)}q${f(r)},0 ${f(r)},${f(r)}` : `h${f(bw)}`) + `V${f(bottom)}Z`;
  };
  rows.forEach((r, i) => {
    const cx = padL + slot * (i + 0.5), x0 = cx - bw / 2, home = Math.max(0, r.used - r.bought);
    const yHome = y(home), yTop = y(r.used), base = y(0);
    // from solar (straight or stored) at the bottom, bought on top, with a 2px gap in the surface colour between them
    const a = column(x0, yHome, base, r.bought <= 0), b = column(x0, yTop, yHome - (home > 0 ? 2 : 0), true);
    if (a) svg += `<path class="seg-a" d="${a}" style="fill: var(--c-solar)"/>`;
    if (b) svg += `<path class="seg-a" d="${b}" style="fill: var(--c-grid)"/>`;
    if (i % r.every === 0 || i === rows.length - 1 && r.every === 1) svg += `<text class="tick" x="${cx.toFixed(1)}" y="${PT + H + 14}" text-anchor="middle">${esc(r.tick)}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${(padL + slot * i).toFixed(1)}" y="${PT}" width="${slot.toFixed(1)}" height="${H}"/>`;
  });
  const what = period === "last_12_months" ? "month" : "day";
  box.innerHTML = `<div class="panel-head" style="margin-bottom: 6px"><span class="panel-title">House use each ${what}<small>kWh</small></span>
      <ul class="keys"><li><i class="sw" style="--c: var(--c-solar)"></i>From solar</li><li><i class="sw" style="--c: var(--c-grid)"></i>Bought</li></ul></div>
    <svg class="plot" width="${W}" height="${PT + H + PB}" viewBox="0 0 ${W} ${PT + H + PB}" role="img" aria-label="House use each ${what}, split into from solar and bought">${svg}<g class="hover"></g></svg>
    <div class="readout" id="bars-readout"></div>
    <details class="more"><summary>${what === "day" ? "Day by day" : "Month by month"}</summary><div class="table-wrap"><table class="data">
      <thead><tr><th scope="col">${what === "day" ? "Day" : "Month"}</th><th scope="col">Solar</th><th scope="col">Used</th><th scope="col">Bought</th><th scope="col">Sold</th><th scope="col">From solar</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${kwh(r.solar)}</td><td>${kwh(r.used)}</td><td>${kwh(r.bought)}</td><td>${kwh(r.sold)}</td><td>${r.used ? Math.round(Math.max(0, r.used - r.bought) / r.used * 100) + "%" : "–"}</td></tr>`).join("")}</tbody>
    </table></div></details>`;
  bars = { W, rows, slot, padL, picked: null };
  const pick = i => {
    const out = document.getElementById("bars-readout"), hover = box.querySelector(".hover");
    if (!out || !hover) return;
    if (i == null) { out.innerHTML = `<span>Tap a bar to see that ${what}'s figures.</span>`; hover.innerHTML = ""; bars.picked = null; return; }
    const r = rows[i], home = Math.max(0, r.used - r.bought);
    out.innerHTML = `<span class="when">${esc(r.name)}</span><span class="ro"><b>${kwh(r.used)}</b>kWh used</span>
      <span class="ro"><i class="sw" style="--c: var(--c-solar)"></i><b>${kwh(home)}</b>from solar (${r.used ? Math.round(home / r.used * 100) : 0}%)</span>
      <span class="ro"><i class="sw" style="--c: var(--c-grid)"></i><b>${kwh(r.bought)}</b>bought</span><span class="ro"><b>${kwh(r.solar)}</b>kWh solar</span>`;
    hover.innerHTML = `<rect class="picked" x="${(padL + slot * i).toFixed(1)}" y="${PT}" width="${slot.toFixed(1)}" height="${H}"/>`;
    bars.picked = i;
  };
  box.onpointerdown = box.onpointermove = e => {
    if (!e.target.closest || !e.target.closest(".plot")) return;              // not the table under it
    if (e.type === "pointermove" && e.pointerType === "pen" && !(e.pressure > 0)) return;   // a pen hovering
    const left = box.querySelector(".plot").getBoundingClientRect().left;
    const i = Math.floor((e.clientX - left - padL) / slot);
    if (i >= 0 && i < rows.length) pick(i);
  };
  box.onpointerleave = e => { if (e.pointerType === "mouse") pick(null); };
  box.onkeydown = e => {
    const moves = { ArrowLeft: -1, ArrowRight: 1 };
    if (!(e.key in moves)) { if (e.key === "Escape") pick(null); return; }
    e.preventDefault();
    pick(Math.max(0, Math.min(rows.length - 1, (bars.picked == null ? rows.length : bars.picked) + moves[e.key])));
  };
  pick(null);
  watchSize();
}

// ---- the tariff and the shower
function tariffCard(t) {
  if (!t) return "";
  const rows = [];
  if (t.now_gbp_a_year) rows.push({ name: `Now: ${t.import}`, sub: "", gbp: t.now_gbp_a_year, now: true });
  (t.options || []).forEach(o => rows.push({ name: o.import, gbp: o.gbp_a_year,
    sub: `with ${o.export}${o.fixed_months ? `; fixed ${o.fixed_months} months` : ""}${o.exit_fee_gbp ? `, £${o.exit_fee_gbp} to leave` : ""}` }));
  const caveat = t.whole_market ? "Every tariff on the market was compared."
    : "Not a recommendation yet: some tariffs couldn't be priced, so the whole market isn't compared.";
  if (!rows.length) return card("tariff", "Tariff", `<p class="lead">${esc(t.import)}</p><p class="fine">${esc(caveat)}</p>`);
  const max = Math.max(...rows.map(r => r.gbp)), cheapest = Math.min(...rows.filter(r => !r.now).map(r => r.gbp));
  const headline = t.now_gbp_a_year && isFinite(cheapest) && cheapest < t.now_gbp_a_year
    ? `<p class="headline">The cheapest option found costs about £${(t.now_gbp_a_year - cheapest).toLocaleString("en-GB")} a year less</p>` : "";
  return card("tariff", "Tariff", headline + `<div class="tbars">${rows.map(r => `<div>
      <div class="tb-name">${esc(r.name)}</div>${r.sub ? `<div class="tb-sub">${esc(r.sub)}</div>` : ""}
      <div class="tb-row"><div class="tb-track"><div class="tb-fill${r.now ? " now" : ""}" style="width: ${(r.gbp / max * 100).toFixed(1)}%"></div></div>
        <span class="tb-val">£${r.gbp.toLocaleString("en-GB")}<span class="fine"> a year</span></span></div></div>`).join("")}</div>
    <p class="fine" style="margin-top: 12px">${esc(caveat)}${t.compared ? ` Compared ${esc(t.compared)}.` : ""}${t.contract_end ? ` Contract ends ${esc(t.contract_end)}.` : ""}</p>`);
}

function showerCard(s) {
  if (!s || !s.rates || !s.rates.length) return "";
  const first = s.rates[0];
  return card("shower", "The shower", `<p class="big-figure">${first.p_per_minute.toFixed(1)}p<small>a minute${s.rates.length > 1 ? `, ${esc(first.label)}` : ""}</small></p>
    <p class="muted" style="margin-top: 6px">${s.rates.map(r => `${r.label === "all day" ? "" : esc(r.label) + ": "}10 minutes costs about ${Math.round(r.p_per_minute * 10)}p`).join(" · ")}.</p>
    <p class="fine" style="margin-top: 8px">About ${esc(s.kw)} kW, at ${s.rates.map(r => r.p_per_unit.toFixed(2) + "p").join(" or ")} a unit. Cheaper when there's spare solar.</p>`);
}

// ---- the page
function setStatus() {
  const el = document.getElementById("status"), r = live.reading, at = r && readingTime(r.time);
  if (at) {
    const late = Date.now() - at > LATE_MINUTES * 60000, day = londonDate(at) !== londonDate() ? shortDate(londonDate(at)) + " " : "";
    el.innerHTML = `<span class="dot ${late ? "late" : "live"}"></span>${late ? "Last reading " + esc(day) : "Live · "}${esc(clock(at))}`;
  } else if (daily) el.innerHTML = `<span class="dot"></span>Updated ${esc(when(daily.made))}`;
  const button = document.getElementById("keep-awake");
  if ("wakeLock" in navigator && daily) {
    const on = !!store("keep-awake");
    button.hidden = false;
    button.setAttribute("aria-pressed", on);
    button.innerHTML = `${icon("screen")}<span class="chip-text">${on ? "Screen stays on" : "Keep screen on"}</span>`;
    button.title = on ? "The screen stays on while this is open" : "Keep the screen on, for a tablet on the wall";
    button.setAttribute("aria-label", "Keep the screen on");
  }
}

function cards() {
  return { now: nowCard, today: todayCard, best: () => daily ? bestTimesCard(daily.best_times) : "", alerts: () => daily ? alertsCard(daily.alerts || []) : "",
           numbers: () => daily ? numbersCard() : "", tariff: () => daily ? tariffCard(daily.tariff) : "", shower: () => daily ? showerCard(daily.shower) : "" };
}

function render() {
  if (document.getElementById("setup")) return;              // a key is being pasted: leave the page alone
  const hidden = store(CARDS_KEY) || {}, html = cards();
  const age = daily ? (Date.now() - new Date(daily.made.replace(" ", "T"))) / 3600000 : 0;
  const warn = daily && (dailyStale || age > 30) ? `<div class="banner">${icon("alert")}<span>The daily figures haven't updated since ${esc(when(daily.made))}. The daily update may have stopped, or there's no internet.</span></div>` : "";
  const main = document.getElementById("main");
  document.getElementById("banner").innerHTML = warn;
  main.innerHTML = CARDS.filter(([id]) => !hidden[id]).map(([id]) => html[id]()).join("");
  main.classList.toggle("live", !!document.getElementById("card-now") && !!document.getElementById("card-today"));
  setStatus();
  renderFooter();
  wire();
  drawCharts();
  drawBars();
}

function refreshCards(...ids) {
  // redraw some cards in place; if one appears or goes, redraw the page
  if (document.getElementById("setup") || !daily) return;
  const hidden = store(CARDS_KEY) || {}, html = cards();
  for (const id of ids) {
    if (hidden[id]) continue;
    const el = document.getElementById("card-" + id), fresh = html[id]();
    if (!el !== !fresh) { render(); return; }       // a card appeared or went: lay the page out again
    if (el) el.outerHTML = fresh;
  }
  setStatus();
  wire();
  if (ids.includes("today")) drawCharts();
  if (ids.includes("numbers")) drawBars();
}

function renderFooter() {
  const source = store(SOURCE_KEY), hidden = store(CARDS_KEY) || {};
  document.getElementById("footer").innerHTML = (daily ? `<p>Daily figures updated ${esc(when(daily.made))}.${source ? ` From the private repository ${esc(source.repo)}.` : ""}</p>` : "") +
    (source ? `<p><span id="alerts-status"></span></p><p><button class="link-btn" id="forget">Forget this device's key</button></p>` : "") +
    `<details class="customise"><summary>Choose what this screen shows</summary><div class="checks">${CARDS.map(([id, name]) =>
      `<label><input type="checkbox" id="show-${id}" data-card="${id}"${hidden[id] ? "" : " checked"}>${esc(name)}</label>`).join("")}</div></details>` +
    (daily ? `<p>${(daily.notes || []).map(esc).join(" ")}</p><p>Sources: ${(daily.sources || []).map(esc).join(" · ")}.</p>` : "");
  const forget = document.getElementById("forget");
  if (forget) forget.onclick = () => { forgetSource(); location.reload(); };
  document.querySelectorAll("[data-card]").forEach(box => box.onchange = () => {
    const now = store(CARDS_KEY) || {};
    if (box.checked) delete now[box.dataset.card]; else now[box.dataset.card] = Date.now();
    store(CARDS_KEY, now);
    render();
    const again = document.querySelector("details.customise");
    if (again) again.open = true;
  });
  if (source) showAlertsStatus(source);
}

function wire() {
  document.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => {
    const hidden = store(HIDDEN_KEY) || {}; hidden[b.dataset.hide] = Date.now(); store(HIDDEN_KEY, hidden); refreshCards("alerts");
  });
  document.querySelectorAll("button[data-period]").forEach(b => b.onclick = () => { store("period", b.dataset.period); refreshCards("numbers"); });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { store("day-view", b.dataset.view); refreshCards("today"); });
  const back = document.getElementById("day-back"), next = document.getElementById("day-next");
  if (back) back.onclick = () => showDay(shiftDate(days.shown || londonDate(), -1));
  if (next) next.onclick = () => showDay(shiftDate(days.shown || londonDate(), 1));
  const awake = document.getElementById("keep-awake");
  awake.onclick = () => { const on = !store("keep-awake"); store("keep-awake", on); keepAwake(on); setStatus(); };
}

// ---- the live figures
async function liveUrl(source) {
  // the live link is written to the private figures repository (GitHub's LIVE_URL secret, or saved there directly)
  const saved = store("live-url");
  // a found link is checked again every 6 hours; until there is one, every 10 minutes
  if (saved && Date.now() - saved.at < (saved.url ? 6 * 3600 : 600) * 1000) return saved.url;
  let url = "";
  try {
    const response = source ? await github(source, "live.json", { headers: { Accept: "application/vnd.github.raw+json" } })
                            : await fetch("live.json", { cache: "no-store" });
    if (response.ok) url = String(((await response.json()) || {}).url || "");
    else if (response.status !== 404) throw new Error(`GitHub answered ${response.status}`);
  } catch (e) { return saved ? saved.url : ""; }
  if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) url = "";     // only the house's own Google script
  store("live-url", { url, at: Date.now() });
  return url;
}

async function ask(params) {
  const url = live.url + (live.url.includes("?") ? "&" : "?") + new URLSearchParams(params);
  const response = await fetch(url, { cache: "no-store" });
  const answer = await response.json();
  if (!answer || !answer.ok) throw new Error((answer && answer.error) || `the live link answered ${response.status}`);
  return answer;
}

async function refreshLive(force) {
  if (!force && (document.hidden || Date.now() - live.asked < 60 * 1000)) return;
  const source = store(SOURCE_KEY);
  if (NEEDS_KEY && !(source && source.key)) return;          // this device isn't set up yet
  live.asked = Date.now();
  const version = live.version;
  live.url = await liveUrl(source && source.key ? source : null);
  if (!live.url) { live.reading = null; store("live-last", null); refreshCards("now", "today"); return; }
  try {
    const answer = await ask({ want: "day" });
    if (answer.version >= 2) {
      live.version = answer.version;
      days.loaded[answer.date] = answer;
      forgetOldDays(answer.date);
      store("day-last", answer);
      if (answer.now) { live.reading = answer.now; store("live-last", answer.now); }
    } else {                                                  // the first version of the script: just the latest reading
      live.version = 1;
      live.reading = answer;
      store("live-last", answer);
    }
    live.error = "";
  } catch (e) {
    live.error = `Couldn't get a new reading: ${message(e)}.`;
  }
  refreshCards("now", "today", ...(live.version !== version ? ["numbers"] : []));
}

async function showDay(date) {
  const today = londonDate();
  if (date > today) date = today;
  if (date < FIRST_DAY) return;
  const before = days.shown;
  days.shown = date === today ? "" : date;
  days.error = "";
  refreshCards("today");                                       // the new day's name, with the last charts dimmed until it arrives
  if (days.loaded[date]) return;
  try {
    const answer = await ask({ want: "day", date });
    if (!(answer.version >= 2)) throw new Error("the live script needs its update first");
    days.loaded[answer.date] = answer;
    forgetOldDays(answer.date);
  } catch (e) {
    if ((days.shown || londonDate()) !== date) return;         // another day was asked for since: leave that one
    days.shown = before;
    days.error = `Couldn't get ${dayName(date)}: ${message(e)}.`;
  }
  refreshCards("today");
}

function forgetOldDays(keep) {
  // the 12 days fetched most recently stay in memory, plus today and the one just fetched
  const today = londonDate(), old = Object.keys(days.loaded).filter(k => k !== today && k !== keep && k !== days.drawn);
  old.slice(0, Math.max(0, old.length - 12)).forEach(k => { delete days.loaded[k]; });
}

async function keepAwake(on) {
  try {
    if (on && !wakeLock && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

// ---- alerts (web push): the device's sign-up is saved in the private repository, where the daily job reads it
function b64uToBytes(text) {
  const pad = "=".repeat((4 - text.length % 4) % 4);
  const raw = atob((text + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

function deviceId() {
  let id = store("device-id");
  if (!id) { id = "device-" + Math.random().toString(36).slice(2, 10); store("device-id", id); }
  return id;
}

async function github(source, path, options = {}) {
  const headers = Object.assign({ Authorization: `Bearer ${source.key}`, "X-GitHub-Api-Version": "2022-11-28" }, options.headers || {});
  return fetch(`https://api.github.com/repos/${source.repo}/contents/${path}`, Object.assign({}, options, { headers, cache: "no-store" }));
}

async function saveSignUp(source, subscription) {
  const path = `subscriptions/${deviceId()}.json`;
  const body = Object.assign(subscription.toJSON(), { device: deviceId(), saved: new Date().toISOString() });
  const existing = await github(source, path);
  const sha = existing.ok ? (await existing.json()).sha : undefined;
  const response = await github(source, path, { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Alert sign-up from ${deviceId()}`, content: btoa(JSON.stringify(body, null, 1)), sha }) });
  if (!response.ok) throw new Error(`GitHub said ${response.status} when saving the sign-up (does the key allow writing?)`);
  store("signup-saved", { endpoint: subscription.endpoint, at: Date.now() });
}

async function alertKey(source) {
  // the public half of the alert key, written to the private repository by the daily job
  const response = await github(source, "push/vapid-public-key.txt", { headers: { Accept: "application/vnd.github.raw+json" } });
  return response.ok ? (await response.text()).trim() : "";
}

function sameKey(subscription, key) {
  const current = subscription.options && subscription.options.applicationServerKey;
  if (!current || !key) return true;                      // can't tell, so leave it
  const a = new Uint8Array(current), b = b64uToBytes(key);
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

async function lastAlert() {
  try {
    const cached = await (await caches.open("home-energy-data")).match("last-alert");
    if (cached) { const a = await cached.json(); return ` Last alert ${new Date(a.at).toLocaleString("en-GB")}.`; }
  } catch (e) {}
  return "";
}

async function showAlertsStatus(source) {
  const box = document.getElementById("alerts-status");
  if (!box) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    box.textContent = "Alerts: on an iPad or iPhone they work in the app opened from the Home Screen (Share → Add to Home Screen).";
    return;
  }
  // the app's background helper (sw.js) receives the alerts; give it a few seconds to start
  const registration = await Promise.race([navigator.serviceWorker.ready, new Promise(done => setTimeout(() => done(null), 8000))]);
  if (!box.isConnected) return;                             // the footer was redrawn meanwhile: that one does its own
  if (!registration) { box.textContent = "Alerts: the app's background helper hasn't started. Close the app fully and open it again."; return; }
  let subscription = await registration.pushManager.getSubscription();
  const key = await alertKey(source).catch(() => "");
  if (!box.isConnected) return;
  if (subscription && key && !sameKey(subscription, key)) {        // the alert key was changed: sign up again
    await subscription.unsubscribe().catch(() => {});
    subscription = null;
  }
  if (subscription && Notification.permission === "granted") {
    box.textContent = "Alerts: on." + await lastAlert();
    // the sign-up can change without warning: save it again when it does, and weekly
    const saved = store("signup-saved") || {};
    if (saved.endpoint !== subscription.endpoint || Date.now() - (saved.at || 0) > 7 * 24 * 3600 * 1000) {
      saveSignUp(source, subscription).catch(e => { box.textContent = "Alerts: on, but " + e.message; });
    }
    return;
  }
  if (!key) { box.textContent = "Alerts: not ready yet. They start once the alert key is saved in GitHub and the daily update has run."; return; }
  if (Notification.permission === "denied") { box.textContent = "Alerts: blocked on this device. Settings → Notifications → Energy turns them on."; return; }
  box.innerHTML = `Alerts: off. <button class="link-btn" id="alerts-on">Turn on alerts</button>`;
  box.querySelector("#alerts-on").onclick = () => {
    // asked straight from the tap: Safari only shows the question in direct response to one
    Notification.requestPermission()
      .then(permission => {
        if (permission !== "granted") throw new Error("not allowed. Settings → Notifications → Energy turns them on.");
        return registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(key) });
      })
      .then(sub => saveSignUp(source, sub))
      .then(() => { box.textContent = "Alerts: on. New alerts arrive with the morning update."; })
      .catch(e => { box.textContent = "Alerts: " + (e.message || e); });
  };
}

// ---- setting up a device: its key is pasted once and kept on that device only
class SetupError extends Error {
  constructor(text, keep) { super(text); this.keep = !!keep; }
}

function forgetSource() { try { localStorage.removeItem(SOURCE_KEY); } catch (e) {} }

function defaultRepo() {
  const owner = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  return owner ? `${owner}/home-energy-data` : "";
}

function showSetup(text, keep) {
  document.getElementById("status").textContent = "Not set up on this device yet";
  document.getElementById("keep-awake").hidden = true;
  document.getElementById("footer").innerHTML = "";
  document.getElementById("banner").innerHTML = "";
  const main = document.getElementById("main");
  main.classList.remove("live");
  if (keep) {
    // the key works but there's nothing to show yet
    main.innerHTML = `<section class="card wide"><div class="card-head"><h2>Set up this device</h2></div><p class="lead">Nearly there</p>
      <p>${esc(text)}</p><div class="actions"><button class="btn" id="setup-retry">Try again</button>
      <button class="btn quiet" id="setup-change">Change the key</button></div></section>`;
    document.getElementById("setup-retry").onclick = () => load();
    document.getElementById("setup-change").onclick = () => { forgetSource(); showSetup(); };
    return;
  }
  main.innerHTML = `<section class="card wide" id="setup"><div class="card-head"><h2>Set up this device</h2></div>
    <p class="lead">Paste this device's key</p>
    <p class="muted">The key lets this device read the house's figures, and nothing else. It stays on this device.
      On an iPad, do this in the app opened from the Home Screen, not in Safari: the two keep separate storage.</p>
    <label class="field">Repository<input id="setup-repo" value="${esc(defaultRepo())}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></label>
    <label class="field">Key<input id="setup-key" type="password" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></label>
    <div class="actions"><button class="btn" id="setup-save">Save on this device</button></div>
    <p class="fine" id="setup-status" role="status">${esc(text || "")}</p></section>`;
  document.getElementById("setup-save").onclick = () => {
    const repo = document.getElementById("setup-repo").value.trim();
    const key = document.getElementById("setup-key").value.trim();
    const status = document.getElementById("setup-status");
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { status.textContent = "The repository should look like owner/name."; return; }
    if (key.startsWith("ghp_")) { status.textContent = "That's a classic key, which can see every repository. Make a fine-grained one (the walk-through's link)."; return; }
    if (!/^github_pat_\w{20,}$/.test(key)) { status.textContent = "That doesn't look like a GitHub key: they start github_pat_."; return; }
    store(SOURCE_KEY, { repo, key, checked: 0 });
    status.textContent = "Checking the key…";
    load();
  };
}

async function privateSource() {
  const source = store(SOURCE_KEY);
  if (!source || !source.repo || !source.key) return null;
  const headers = { Authorization: `Bearer ${source.key}`, "X-GitHub-Api-Version": "2022-11-28" };
  if (Date.now() - (source.checked || 0) > 24 * 3600 * 1000) {
    // refuse a key that can also open the playbook: it should only see the energy figures
    const probe = await fetch(`https://api.github.com/repos/${PLAYBOOK}`, { headers, cache: "no-store" });
    if (probe.ok) {
      forgetSource();
      throw new SetupError("That key can also see the owner's private playbook, so it was refused and forgotten. Make a key that can only see the energy figures.");
    }
    if (probe.status === 401) {
      forgetSource();
      throw new SetupError("GitHub didn't accept that key: it may be mistyped, expired or deleted. Paste a new one.");
    }
    const own = await fetch(`https://api.github.com/repos/${source.repo}`, { headers, cache: "no-store" });
    if (own.status === 404) {
      forgetSource();
      throw new SetupError(`That key can't see ${source.repo}. Check the name, or make the key again with that repository picked.`);
    }
    if (!own.ok) throw new Error(`GitHub answered ${own.status}`);    // e.g. no internet: try again later
    source.checked = Date.now();
    store(SOURCE_KEY, source);
  }
  return { repo: source.repo, url: `https://api.github.com/repos/${source.repo}/contents/app-data.json`,
           headers: Object.assign({ Accept: "application/vnd.github.raw+json" }, headers) };
}

async function load() {
  try {
    const source = await privateSource();
    if (!source && NEEDS_KEY) { showSetup(); return; }
    const response = source ? await fetch(source.url, { headers: source.headers, cache: "no-store" })
                            : await fetch(DATA_URL, { cache: "no-store" });
    if (source && response.status === 404) {
      throw new SetupError(`The key works, but there are no figures in ${source.repo} yet. They appear after the daily update has run.`, true);
    }
    if (!response.ok) throw new Error(`the figures couldn't be fetched (${response.status})`);
    daily = await response.json();
    dailyStale = false;
    store("last-data", daily);
    document.getElementById("main").innerHTML = "";              // leaves a finished set-up card behind
    render();
  } catch (error) {
    if (error instanceof SetupError) { showSetup(error.message, error.keep); return; }
    const last = store("last-data");
    if (last) { daily = last; dailyStale = true; render(); }
    else document.getElementById("main").innerHTML = `<section class="card wide"><p class="lead">Couldn't load the figures.</p><p class="muted">${esc(error.message || error)}</p></section>`;
  }
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load().then(() => refreshLive(true));
// refresh every half hour and on coming back to the app, but never while a key is being pasted
function refresh() { if (!document.getElementById("setup-key")) load(); }
setInterval(refresh, 30 * 60 * 1000);
setInterval(() => refreshLive(), LIVE_EVERY);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  refresh();
  refreshLive();
  if (store("keep-awake")) keepAwake(true);                  // the screen lock is let go whenever the app is hidden
});
if (store("keep-awake")) keepAwake(true);
</script>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Home Energy</title>
<meta name="description" content="The house's solar, battery and electricity, live: where the power is coming from right now, today's charts, the best times to use power, costs and savings.">
<meta name="theme-color" content="#eceeeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Energy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  /* A calm instrument panel: the device's own system type, quiet cool surfaces, and colour only on
     the energy itself (solar, house, grid, battery) plus one deep teal for controls.
     Layout: on a phone, one column with the live flow first; on a tablet, two columns; on a wide
     screen (a tablet on the wall), the live flow and today's charts side by side.
     The four energy colours and the two surfaces were checked with the dataviz palette validator
     (colour-blind separation, contrast) in light and dark: change them only after re-checking. */
  :root {
    color-scheme: light;
    --page: #eceeeb;
    --surface: #fcfcfb;
    --well: #f1f2ef;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #74736e;
    --line: rgba(11, 11, 11, 0.1);
    --gridline: #e1e0d9;
    --axis: #c3c2b7;
    --brand: #0f3d3a;
    --on-brand: #ffffff;
    --brand-text: #0f5c55;
    --c-solar: #eda100;
    --c-home: #2a78d6;
    --c-grid: #e87ba4;
    --c-battery: #008300;
    --good: #0ca30c;
    --good-soft: #b4e0b0;
    --cell: #e2e4df;
    --warning: #fab219;
    --critical: #d03b3b;
    --good-text: #006300;
    --note-bg: #fff4d6;
    --note-ink: #5c4300;
    --good-line: rgba(12, 163, 12, 0.35);
    --good-wash: rgba(12, 163, 12, 0.07);
    --tip-bg: #22262b;
    --tip-ink: #f3f4f6;
    --tip-muted: #b8bec6;
    /* the picture: soft clay-white tiles and objects, a few real colours */
    --iso-tile-top: #f1f3f5; --iso-tile-left: #dde2e7; --iso-tile-right: #c9d0d8; --iso-soft: rgba(30, 41, 59, 0.045); --iso-shade: rgba(30, 41, 59, 0.10);
    --iso-wall-left: #ffffff; --iso-wall-right: #e4e8ec; --iso-roof: #34445a; --iso-roof-edge: #4a5b72; --iso-window: #bcd6f0; --iso-door: #6b7686;
    --iso-leaf-1: #4caf50; --iso-leaf-2: #3d9142; --iso-leaf-3: #6cc56f; --iso-trunk: #8a6a4f;
    --iso-panel: #1f3d66; --iso-panel-hi: #2d5a92; --iso-panel-line: rgba(160, 196, 235, 0.55); --iso-frame: #d5dde6; --iso-leg: #9aa6b2;
    --iso-steel: #9ba6b2; --iso-wire: #aab4be;
    --iso-bat-top: #f6f8fa; --iso-bat-left: #ffffff; --iso-bat-right: #e1e6eb; --iso-bat-window: #e6ebf0; --iso-bat-level: #3cc46b; --iso-bat-level-hi: #74dc95;
    --iso-line: #c3cdd8; --iso-hub: #ffffff; --iso-hub-ring: #b9c4d0;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 6px 18px rgba(11, 11, 11, 0.05);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --r-card: 22px;
    --r-tile: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e0f0e; --surface: #1a1a19; --well: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #94938c;
      --line: rgba(255, 255, 255, 0.1); --gridline: #2c2c2a; --axis: #45453f;
      --brand: #8fd3c7; --on-brand: #0a1715; --brand-text: #8fd3c7;
      --c-solar: #c98500; --c-home: #3987e5; --c-grid: #d55181; --c-battery: #008300;
      --good-soft: #1d4d1d; --cell: #2c2c2a; --good-text: #0ca30c; --note-bg: #2e2510; --note-ink: #f2d690; --shadow: none;
      --good-line: rgba(12, 163, 12, 0.45); --good-wash: rgba(12, 163, 12, 0.12); --tip-bg: #2a2e33; --tip-ink: #f3f4f6; --tip-muted: #aeb5be;
      --iso-tile-top: #2a2d31; --iso-tile-left: #212428; --iso-tile-right: #1a1c1f; --iso-soft: rgba(0, 0, 0, 0.22); --iso-shade: rgba(0, 0, 0, 0.35);
      --iso-wall-left: #d9dee4; --iso-wall-right: #aeb6bf; --iso-roof: #25303e; --iso-roof-edge: #334155; --iso-window: #7fa7cf; --iso-door: #4b5563;
      --iso-leaf-1: #3b8f3f; --iso-leaf-2: #2f7433; --iso-leaf-3: #4fa853; --iso-trunk: #6d5440;
      --iso-panel: #1b3557; --iso-panel-hi: #274b7a; --iso-panel-line: rgba(140, 180, 225, 0.45); --iso-frame: #8d99a6; --iso-leg: #6b7682;
      --iso-steel: #8a96a3; --iso-wire: #6f7b88;
      --iso-bat-top: #c9d0d7; --iso-bat-left: #dde2e7; --iso-bat-right: #aab3bd; --iso-bat-window: #3a4048; --iso-bat-level: #2fb35c; --iso-bat-level-hi: #5fd487;
      --iso-line: #3c4550; --iso-hub: #1a1a19; --iso-hub-ring: #56606b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e0f0e; --surface: #1a1a19; --well: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #94938c;
    --line: rgba(255, 255, 255, 0.1); --gridline: #2c2c2a; --axis: #45453f;
    --brand: #8fd3c7; --on-brand: #0a1715; --brand-text: #8fd3c7;
    --c-solar: #c98500; --c-home: #3987e5; --c-grid: #d55181; --c-battery: #008300;
    --good-soft: #1d4d1d; --cell: #2c2c2a; --good-text: #0ca30c; --note-bg: #2e2510; --note-ink: #f2d690; --shadow: none;
    --good-line: rgba(12, 163, 12, 0.45); --good-wash: rgba(12, 163, 12, 0.12); --tip-bg: #2a2e33; --tip-ink: #f3f4f6; --tip-muted: #aeb5be;
    --iso-tile-top: #2a2d31; --iso-tile-left: #212428; --iso-tile-right: #1a1c1f; --iso-soft: rgba(0, 0, 0, 0.22); --iso-shade: rgba(0, 0, 0, 0.35);
    --iso-wall-left: #d9dee4; --iso-wall-right: #aeb6bf; --iso-roof: #25303e; --iso-roof-edge: #334155; --iso-window: #7fa7cf; --iso-door: #4b5563;
    --iso-leaf-1: #3b8f3f; --iso-leaf-2: #2f7433; --iso-leaf-3: #4fa853; --iso-trunk: #6d5440;
    --iso-panel: #1b3557; --iso-panel-hi: #274b7a; --iso-panel-line: rgba(140, 180, 225, 0.45); --iso-frame: #8d99a6; --iso-leg: #6b7682;
    --iso-steel: #8a96a3; --iso-wire: #6f7b88;
    --iso-bat-top: #c9d0d7; --iso-bat-left: #dde2e7; --iso-bat-right: #aab3bd; --iso-bat-window: #3a4048; --iso-bat-level: #2fb35c; --iso-bat-level-hi: #5fd487;
    --iso-line: #3c4550; --iso-hub: #1a1a19; --iso-hub-ring: #56606b;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font: 16px/1.45 var(--font); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
         -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; color: inherit; }
  p { margin: 0; }
  :focus-visible { outline: 2.5px solid var(--brand-text); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .i { width: 20px; height: 20px; flex: none; }
  .muted { color: var(--ink-2); }
  .fine { font-size: 13px; line-height: 1.45; color: var(--ink-2); }

  /* the header */
  .top { padding-block: 18px 4px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 42px; height: 42px; border-radius: 13px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; flex: none; }
  .logo .i { width: 23px; height: 23px; }
  h1 { font-size: 24px; line-height: 1.15; margin: 0; letter-spacing: -0.015em; font-weight: 700; }
  .status { margin-top: 3px; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; min-height: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--good); animation: pulse 2.4s ease-out infinite; }
  .dot.late { background: var(--warning); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.45); } 70%, 100% { box-shadow: 0 0 0 7px rgba(12, 163, 12, 0); } }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
          padding: 8px 14px; font-size: 14px; font-weight: 550; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: transparent; }
  .chip .i { width: 17px; height: 17px; }
  @media (max-width: 420px) { .chip .chip-text { display: none; } .chip { padding: 9px; } }

  /* the cards */
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-auto-flow: row dense; padding-block: 12px 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow);
          min-width: 0; container-type: inline-size; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; margin: 0 0 14px; min-height: 36px; flex-wrap: wrap; }
  h2 { font-size: 19px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
  .banner { display: flex; gap: 10px; align-items: flex-start; background: var(--note-bg); color: var(--note-ink); border-radius: 16px; padding: 12px 16px; font-size: 15px; }
  .note { display: flex; gap: 9px; align-items: flex-start; background: var(--note-bg); color: var(--note-ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .note .i, .banner .i { width: 18px; height: 18px; margin-top: 1px; }
  .stack { display: grid; gap: 14px; }

  /* right now: the picture, drawn in isometric 3D like the FoxESS dashboard */
  .iso-scene { position: relative; max-width: 560px; margin: 0 auto; }
  .iso-scene svg { display: block; width: 100%; height: auto; overflow: visible; }
  .iso-label { position: absolute; transform: translate(0, -100%); white-space: nowrap; line-height: 1.15; pointer-events: none; }
  .iso-label.right { transform: translate(-100%, -100%); text-align: right; }
  .iso-label .k { font-size: 12.5px; color: var(--ink-2); }
  .iso-label .v { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  .iso-label .v small { font-size: 13px; font-weight: 550; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
  @container (max-width: 380px) { .iso-label .v { font-size: 18px; } .iso-label .k { font-size: 12px; } }
  .iso-tile-top { fill: var(--iso-tile-top); } .iso-tile-side { fill: url(#iso-side); } .iso-soft { fill: var(--iso-soft); } .iso-shade { fill: var(--iso-shade); }
  .iso-wall-l { fill: var(--iso-wall-left); } .iso-wall-r { fill: var(--iso-wall-right); } .iso-roof { fill: var(--iso-roof); } .iso-roof-edge { fill: var(--iso-roof-edge); }
  .iso-window { fill: var(--iso-window); } .iso-door { fill: var(--iso-door); } .iso-trunk { fill: var(--iso-trunk); }
  .iso-leaf-1 { fill: var(--iso-leaf-1); } .iso-leaf-2 { fill: var(--iso-leaf-2); } .iso-leaf-3 { fill: var(--iso-leaf-3); }
  .iso-panel { fill: url(#iso-glass); stroke: var(--iso-frame); stroke-width: 0.9; stroke-linejoin: round; }
  .iso-cells { fill: none; stroke: var(--iso-panel-line); stroke-width: 0.6; }
  .iso-leg { stroke: var(--iso-leg); stroke-width: 1.4; stroke-linecap: round; }
  .iso-steel { fill: none; stroke: var(--iso-steel); stroke-width: 1.15; stroke-linecap: round; } .iso-wire { fill: none; stroke: var(--iso-wire); stroke-width: 0.8; }
  .iso-bat-t { fill: var(--iso-bat-top); } .iso-bat-l { fill: var(--iso-bat-left); } .iso-bat-r { fill: var(--iso-bat-right); }
  .iso-bat-window { fill: var(--iso-bat-window); } .iso-bat-level { fill: url(#iso-charge); } .iso-led { fill: var(--c-battery); }
  .iso-link { stroke: var(--iso-line); stroke-width: 2.2; stroke-linecap: round; }
  .iso-dots { fill: none; stroke-width: 4.2; stroke-linecap: round; stroke-dasharray: 0.01 12; animation: run var(--dur, 1s) linear infinite; }
  .iso-chev { display: none; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .iso-hub { fill: var(--iso-hub); stroke: var(--iso-hub-ring); stroke-width: 2.4; }
  @keyframes run { to { stroke-dashoffset: -12.01; } }
  @media (prefers-reduced-motion: reduce) {
    .iso-dots { display: none; }
    .iso-link.on { stroke: var(--c); }
    .iso-chev { display: inline; }
    .dot.live { animation: none; }
  }
  .now-tools { gap: 10px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--good-text);
                border: 1px solid var(--good-line); background: var(--good-wash); border-radius: 7px; padding: 3px 9px; }
  .live-badge.late { color: var(--note-ink); border-color: var(--line); background: var(--note-bg); }
  .now-words { margin-top: 10px; }
  .story { font-size: 18px; line-height: 1.4; font-weight: 550; text-wrap: pretty; }
  .share-title { font-size: 13.5px; color: var(--ink-2); margin-bottom: 7px; }
  .share-bar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
  .share-bar span { min-width: 3px; background: var(--c); }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
  .keys li { display: inline-flex; align-items: center; gap: 6px; }
  .keys b { color: var(--ink); font-weight: 650; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .lk { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @container (min-width: 540px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { background: var(--well); border-radius: var(--r-tile); padding: 12px 14px 13px; min-width: 0; }
  .tile-label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px; white-space: nowrap; line-height: 1.15; }
  .tile-value small { font-size: 14px; font-weight: 550; color: var(--ink-2); margin-left: 3px; letter-spacing: 0; }
  .tile-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }

  /* controls */
  .tools { display: flex; align-items: center; gap: 8px; }
  .seg { display: inline-flex; background: var(--well); border-radius: 999px; padding: 3px; gap: 2px; max-width: 100%; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 550; color: var(--ink-2);
                cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .seg button .i { width: 18px; height: 18px; }
  .seg.icons button { padding: 6px 9px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 0 0 1px var(--line); }
  .seg.full { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); justify-content: start; }
  @container (max-width: 380px) { .seg.full { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
                                  .seg.full button { padding: 7px 4px; font-size: 13px; } }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: inline-grid;
              place-items: center; cursor: pointer; color: var(--ink); padding: 0; }
  .icon-btn .i { width: 18px; height: 18px; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .btn { font-weight: 600; border: 0; border-radius: 999px; padding: 12px 20px; background: var(--brand); color: var(--on-brand); cursor: pointer; }
  .btn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .link-btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }

  /* the energy card: supply above the line, use below, as in FoxESS's app */
  .card.busy .ec, .card.busy .tiles, .card.busy .table-wrap { opacity: 0.45; transition: opacity 0.2s; }
  .period { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .period-nav { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .period-name { font-weight: 650; font-size: 15.5px; min-width: 6.5em; text-align: center; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 6px; }
  .chip-key { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px;
              padding: 5px 9px; font-size: 13px; font-weight: 550; cursor: pointer; color: var(--ink); }
  .chip-key[aria-pressed="false"] { color: var(--muted); }
  .chip-key[aria-pressed="false"] .sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  .ec { position: relative; touch-action: pan-y; -webkit-user-select: none; user-select: none; border-radius: 10px; }
  .st-area { stroke: none; fill-opacity: 0.78; }
  .st-edge { fill: none; stroke-width: 1.3; stroke-linejoin: round; }
  .st-bar { stroke: none; }
  .tip { position: absolute; top: 6px; min-width: 196px; background: var(--tip-bg); color: var(--tip-ink); border-radius: 12px; padding: 10px 12px 9px;
         font-size: 13px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22); pointer-events: none; z-index: 2; font-variant-numeric: tabular-nums; }
  .tip-time { font-weight: 650; margin-bottom: 5px; }
  .tip-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; line-height: 1.75; }
  .tip-row span { color: var(--tip-muted); }
  .tip-row b { font-weight: 650; text-align: right; }
  .tip-gap { height: 4px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; font-size: 13.5px; margin: 10px 0 2px; }
  .panel-title { font-weight: 600; color: var(--ink); }
  .panel-title small { font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-left: 4px; }
  .plot { display: block; overflow: visible; }
  .plot .gl { stroke: var(--gridline); stroke-width: 1; shape-rendering: crispEdges; }
  .plot .zero { stroke: var(--axis); stroke-width: 1.2; shape-rendering: crispEdges; }
  .plot .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .plot .dir { fill: var(--muted); font-size: 11px; }
  .plot .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plot .end { stroke: var(--surface); stroke-width: 2; }
  .plot .cross { stroke: var(--ink-2); stroke-width: 1; shape-rendering: crispEdges; }
  .plot .picked { fill: var(--ink); fill-opacity: 0.07; }

  /* tables */
  .table-wrap { overflow-x: auto; margin-top: 14px; border-radius: 12px; border: 1px solid var(--line); }
  table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  table.data thead th:first-child { background: var(--well); }
  table.data thead th { font-weight: 600; color: var(--ink-2); background: var(--well); }
  table.data tfoot th, table.data tfoot td { font-weight: 650; border-bottom: 0; }
  details.more { margin-top: 12px; }

  /* best times */

  .bt-name { font-weight: 650; font-size: 16px; }
  .bt-text { margin-top: 4px; font-size: 16px; text-wrap: pretty; }
  .strip { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px; margin: 12px 0 5px; }
  .strip span { height: 30px; border-radius: 5px; background: var(--cell); }

  .hours span { white-space: nowrap; overflow: visible; }

  .alert { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }

  .badge { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #ffffff; background: var(--s); }

  .alert-title { font-weight: 600; text-wrap: pretty; }
  .alert-kind { font-size: 12.5px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .alert-details { font-size: 14px; color: var(--ink-2); margin-top: 3px; text-wrap: pretty; }
  .calm { display: flex; gap: 12px; align-items: center; }

  /* tariff bars */
  .tbars { display: grid; gap: 12px; }
  .tb-name { font-size: 14.5px; font-weight: 600; }
  .tb-sub { font-size: 13px; color: var(--ink-2); }
  .tb-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-top: 5px; }
  .tb-track { height: 14px; }
  .tb-fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--brand-text); min-width: 2px; }
  .tb-fill.now { background: var(--axis); }
  .tb-val { font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .headline { font-size: 18px; font-weight: 600; margin-bottom: 12px; text-wrap: balance; }

  /* the shower */
  .big-figure { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
  .big-figure small { font-size: 15px; font-weight: 550; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }

  /* the footer and setting up */
  footer { padding-block: 4px 32px; font-size: 13px; color: var(--ink-2); display: grid; gap: 10px; }
  footer p { max-width: 75ch; }
  details.customise summary { cursor: pointer; font-weight: 600; color: var(--ink); font-size: 14px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; }
  .checks label { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); }
  .checks input { width: 18px; height: 18px; accent-color: var(--brand-text); }
  .field { display: block; margin: 14px 0 0; font-size: 15px; color: var(--ink-2); }
  .field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 17px; color: var(--ink); background: var(--well);
                 border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }
  .lead { font-size: 18px; font-weight: 600; margin-bottom: 6px; }

  #banner:not(:empty) { padding-top: 12px; }
  @media (min-width: 720px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .card { padding: 22px; }
    #card-now, #card-energy, #card-best, #card-numbers, .wide { grid-column: 1 / -1; }

    .grid.live { grid-template-rows: auto 1fr; }

    .grid.live #card-energy { grid-column: 6 / span 7; grid-row: 1 / span 2; }
  }

</head>

<footer class="wrap" id="footer"></footer>
<script>
"use strict";
const DATA_PARAM = new URLSearchParams(location.search).get("data");
const DATA_URL = DATA_PARAM || "app-data.json";
// Where the figures come from (the owner's choice, 2026-10-22: "GitHub only"): a private GitHub
// repository, read with a key that can only see that repository. Each device's key is pasted into
// the set-up card once and kept on that device only. On an iPad the Home Screen app has its own
// storage, separate from Safari's, so the key is pasted inside the app.

const NEEDS_KEY = location.hostname.endsWith(".github.io") && !DATA_PARAM;
const PLAYBOOK = "rrlouisp/life-playbook";     // a key that can see this is refused
const SOURCE_KEY = "private-source";
const HIDDEN_KEY = "hidden-alerts";
const CARDS_KEY = "hidden-cards";
const ZONE = "Europe/London";
const PERIODS = [["yesterday", "Yesterday"], ["this_month", "This month"], ["last_month", "Last month"], ["last_12_months", "12 months"]];
const CARDS = [["now", "Right now"], ["energy", "Energy"], ["best", "Best times to use power"], ["alerts", "Alerts"],
               ["numbers", "The numbers"], ["tariff", "Tariff"], ["shower", "The shower"]];
// Live figures (#165): the inverter's readings, about every 5 minutes, from a small script in the
// house's own Google account. Its address is private: it's read from the figures repository with this
// device's key, never written into this public page. Version 2 of the script also gives each day's
// 5-minute readings and totals, and each month's and year's totals, for the charts.
const LIVE_EVERY = 5 * 60 * 1000;
const LATE_MINUTES = 20;            // a reading older than this means the inverter may be off
const ON_KW = 0.02;                 // anything less counts as nothing flowing
const FIRST_DAY = "2023-07-01";     // the earliest day the charts go back to
const live = { url: "", reading: store("live-last"), error: "", asked: 0, version: 0 };
const days = { loaded: {} };                                    // each day's readings, by date
const extra = { months: {}, years: {} };                        // month and year totals, for the bar charts
let daily = null, dailyStale = false, wakeLock = null, chart = null, resizer = null;
(() => {
  const last = store("day-last");

})();

// ---- small helpers
function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const DAY_FMT = new Intl.DateTimeFormat("en-CA", { timeZone: ZONE, year: "numeric", month: "2-digit", day: "2-digit" });
const CLOCK_FMT = new Intl.DateTimeFormat("en-GB", { timeZone: ZONE, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const PARTS_FMT = new Intl.DateTimeFormat("en-GB", { timeZone: ZONE, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit",
                                                    hour: "2-digit", minute: "2-digit", second: "2-digit" });
function londonDate(d = new Date()) { return DAY_FMT.format(d); }
function clock(d) { return CLOCK_FMT.format(d); }
function clockMinute(seconds) { const [h, m] = clock(new Date(seconds * 1000)).split(":"); return +h * 60 + +m; }

  const p = Object.fromEntries(PARTS_FMT.formatToParts(new Date(seconds * 1000)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) / 1000 - Math.floor(seconds);

}

  return new Date(date + "T12:00:00Z").toLocaleDateString("en-GB", Object.assign({ day: "numeric", month: "short", timeZone: "UTC" },
                                                                                withDay ? { weekday: "short" } : {}));
}
function dayName(date) {
  const today = londonDate();
  return date === today ? "Today" : date === shiftDate(today, -1) ? "Yesterday" : shortDate(date);
}
function when(stamp) {
  const d = new Date(String(stamp || "").replace(" ", "T"));
  return isNaN(d) ? stamp : d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function readingTime(text) {
  // FoxESS's time, e.g. "2026-10-23 17:00:27 BST+0100"
  const m = /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}).*([+-]\d{2})(\d{2})$/.exec(text || "");
  return m ? new Date(`${m[1]}T${m[2]}${m[3]}:${m[4]}`) : null;

// Line icons (24 × 24, drawn with the text colour)
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  house: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/>',
  grid: '<path d="M12 2v20"/><path d="M2 5h20"/><path d="M3 3v2M7 3v2M17 3v2M21 3v2"/><path d="m19 5-7 7-7-7"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',

  eye: '<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>',

  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',

function shareBar(title, parts) {

// ---- right now: a picture of where the power is going, in the style of the FoxESS dashboard
function flows(r) {
  const v = k => Math.max(0, num(r[k]) || 0);
  return { solar: v("solar_kw"), house: v("house_kw"), buy: v("buying_kw"), sell: v("selling_kw"),
           charge: v("battery_charge_kw"), give: v("battery_discharge_kw"), pct: num(r.battery_percent) };
}

function story(r) {
  const f = flows(r);
  if (f.house < ON_KW) {
    const spare = [f.charge >= ON_KW && "charging the battery", f.sell >= ON_KW && "going to the grid"].filter(Boolean);
    return f.solar >= 0.05 && spare.length ? `Solar is making ${kw(f.solar)} kW. The house needs almost nothing, so it's ${and(spare)}.`
                                           : "The house is using almost nothing right now.";
  }
  const from = [f.give >= ON_KW && "the battery", f.buy >= ON_KW && "the grid"].filter(Boolean);
  const spare = [f.charge >= ON_KW && "charging the battery", f.sell >= ON_KW && "going to the grid"].filter(Boolean);
  let text;
  if (f.solar < 0.05) text = `No solar right now: the house is running on ${and(from) || "the battery"}.`;
  else if (f.solar >= f.house * 0.97) text = `Solar is covering everything the house is using${spare.length ? `, and the spare is ${and(spare)}` : ""}.`;
  else text = `Solar is covering about ${Math.round(f.solar / f.house * 100)}% of what the house is using. The rest is coming from ${and(from) || "the battery"}.`;
  if (f.charge >= ON_KW && f.buy >= ON_KW && f.solar < 0.05) text += " The battery is charging from the grid.";

// The picture is drawn here in isometric 3D (x runs down to the right, y down to the left, z up), from
// simple shapes: nothing in it is copied from FoxESS's own artwork. Colours come from the --iso tokens.
const C30 = Math.cos(Math.PI / 6), TILE = 104, GAP = 146, THICK = 9;
const SCENE = { x: -228, y: -226, w: 456, h: 432 };

         face([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], right);

  const pts = [];
  for (const [sx, sy, a0] of [[1, 1, 0], [-1, 1, 90], [-1, -1, 180], [1, -1, 270]])
    for (let k = 0; k <= 6; k++) { const a = (a0 + k * 15) * Math.PI / 180; pts.push([cx + sx * (half - r) + r * Math.cos(a), cy + sy * (half - r) + r * Math.sin(a)]); }

function tileSvg(cx, cy) {

}

function houseSvg(cx, cy) {
  const w = 58, d = 46, h = 30, rh = 19, o = 4, x = cx - w / 2 + 2, y = cy - d / 2 + 2, z = THICK;
  const drop = o * rh / (d / 2), ridge = z + h + rh, eave = z + h - drop, th = 2.6;
  let s = "";
  // a tree behind, to the right
  const tx = cx + 34, ty = cy - 30;
  s += face([[tx - 10, ty - 6, z + 0.2], [tx + 12, ty - 6, z + 0.2], [tx + 12, ty + 12, z + 0.2], [tx - 10, ty + 12, z + 0.2]], "iso-shade");
  s += block(tx - 1.5, ty - 1.5, z, 3, 3, 14, ["iso-trunk", "iso-trunk", "iso-trunk"]);

       `<circle class="iso-leaf-1" cx="${f1(c[0])}" cy="${f1(c[1])}" r="12"/><circle class="iso-leaf-3" cx="${f1(c[0] - 4)}" cy="${f1(c[1] - 4)}" r="5.5"/>`;
  // its shadow, the walls and the gable end
  s += face([[x + w, y, z + 0.2], [x + w + 16, y + 6, z + 0.2], [x + w + 16, y + d + 10, z + 0.2], [x + 6, y + d + 10, z + 0.2], [x, y + d, z + 0.2]], "iso-shade");

function pylonSvg(cx, cy, H) {

function sceneSvg(f) {

    tileSvg(...node.solar) + solarSvg(...node.solar) + tileSvg(...node.home) + houseSvg(...node.home) +
    tileSvg(...node.battery) + batterySvg(...node.battery, f.pct == null ? 0 : f.pct) + tileSvg(...node.grid) + gridSvg(...node.grid);

// ---- money for a day: FoxESS's meter totals, priced by when the power was used, at today's prices
function usedKwh(t) {
  const need = ["solar", "gave", "bought", "charged", "sold"];
  return need.every(k => num(t[k]) != null) ? Math.max(0, t.solar + t.gave + t.bought - t.charged - t.sold) : null;
}
function priceAt(bands, minute) {
  for (const [start, end, p] of bands || []) {
    if (start === end) return p;
    if (start < end && minute >= start && minute < end) return p;
    if (start > end && (minute >= start || minute < end)) return p;
  }
  return null;
}
function steps(d, fn) {
  // each 5-minute step of a day: its length in hours and its middle (seconds after midnight)
  const t = d.points.t;
  for (let i = 1; i < t.length; i++) {
    const h = (t[i] - t[i - 1]) / 3600;
    if (h > 0 && h <= 0.5) fn(i, h, (t[i] + t[i - 1]) / 2);
  }
}
function at(d, col, i) { const a = d.points[col]; return a && a[i] != null ? Math.max(0, +a[i]) : 0; }
function energy(d, col, i, h) { return (at(d, col, i) + at(d, col, i - 1)) / 2 * h; }

function dayMoney(d) {
  const prices = daily && daily.prices;
  if (!prices || !prices.import_bands || !d.points || !d.totals) return null;
  const sum = { buy: [0, 0], sell: [0, 0], use: [0, 0] };
  steps(d, (i, h, mid) => {
    const minute = clockMinute(d.start + mid);
    const pi = priceAt(prices.import_bands, minute), pe = priceAt(prices.export_bands, minute) || 0;
    if (pi == null) return;
    for (const [k, col, p] of [["buy", "buying", pi], ["sell", "selling", pe], ["use", "house", pi]]) {
      const e = energy(d, col, i, h);
      sum[k][0] += e; sum[k][1] += e * p;
    }
  });
  const flat = priceAt(prices.import_bands, 12 * 60) || 0;
  const avg = (k, fallback) => sum[k][0] > 0.01 ? sum[k][1] / sum[k][0] : fallback;
  const t = d.totals, used = usedKwh(t);
  if (num(t.bought) == null || used == null) return null;
  const paid = t.bought * avg("buy", flat), earned = (t.sold || 0) * avg("sell", priceAt(prices.export_bands, 12 * 60) || 0);
  const standing = prices.standing_p_day || 0;
  return { spent: (paid + standing - earned) / 100, saved: (used * avg("use", flat) - paid + earned) / 100, standing };
}

function priceWords() {
  const p = daily && daily.prices;
  if (!p) return "";
  const rates = [...new Set((p.import_bands || []).map(b => b[2]))].sort((a, b) => a - b);
  const exp = [...new Set((p.export_bands || []).map(b => b[2]))];
  const unit = rates.length === 1 ? `${pence(rates[0])} a unit` : `${pence(rates[0])} to ${pence(rates[rates.length - 1])} a unit`;
  return `Money at today's prices (${esc(p.import)}: ${unit}, ${pence(p.standing_p_day)} a day; ${exp.every(v => !v) ? "exports aren't paid" : `exports earn ${exp.map(pence).join(" to ")}`}).`;
}

function hourRows(d) {
  // kWh in each hour from the 5-minute readings, scaled so each column adds up to FoxESS's meter total
  const cols = { solar: "solar", house: "house", bought: "buying", sold: "selling", charged: "charging", gave: "giving" };
  const rows = [];
  steps(d, (i, h, mid) => {
    const n = Math.floor(mid / 3600);
    const row = rows[n] || (rows[n] = { n, level: null });
    for (const [name, col] of Object.entries(cols)) row[name] = (row[name] || 0) + energy(d, col, i, h);
    const level = d.points.battery && d.points.battery[i];
    if (level != null) row.level = level;
  });
  const t = d.totals || {}, meter = { solar: t.solar, house: usedKwh(t), bought: t.bought, sold: t.sold, charged: t.charged, gave: t.gave };
  const list = rows.filter(Boolean);
  for (const [name, total] of Object.entries(meter)) {
    const sum = list.reduce((a, r) => a + (r[name] || 0), 0);
    if (num(total) != null && sum > 0.05) list.forEach(r => { r[name] = (r[name] || 0) * total / sum; });
  }
  return list;
}

function tableHtml(caption, first, rows, foot, note) {

  const cell = v => `<td>${v == null ? "–" : typeof v === "string" ? v : v < 0.05 ? "0" : kwh(v)}</td>`;
  const level = rows.some(r => r.length > 7);

      <th scope="col">Battery in</th><th scope="col">Battery out</th>${level ? `<th scope="col">Level</th>` : ""}</tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(cell).join("")}</tr>`).join("")}</tbody>

// ---- the energy card: a day's power every 5 minutes, or each day of a month, or each month of a year.
// What came in (solar, the battery, the grid) is stacked above the line, and where it went (the house,
// the battery, the grid) below it, as in FoxESS's own app.
const IN = [["solar", "Solar"], ["battery", "From the battery"], ["grid", "Bought"]];
const OUT = [["home", "House"], ["battery", "Into the battery"], ["grid", "Sold"]];
const CHIPS = [["solar", "Solar"], ["battery", "Battery"], ["grid", "Grid"], ["home", "House"]];

async function getAnswer(kept, key, params, keepMinutes) {
  const found = kept[key];

  const answer = await ask(params);
  if (!(answer.version >= 2)) throw new Error("the live script needs its update first");
  kept[key] = { at: Date.now(), answer };
  return answer;
}
function balanceRow(get, i) {
  const v = k => num(get[k] && get[k][i]);
  const solar = v("solar"), bought = v("bought"), sold = v("sold"), charged = v("charged"), gave = v("gave");
  if ([solar, bought, sold, charged, gave].some(x => x == null)) return null;
  return { solar, bought, sold, charged, gave, used: Math.max(0, solar + gave + bought - charged - sold) };
}

function now3() { const today = londonDate(); return { day: today, month: today.slice(0, 7), year: today.slice(0, 4) }; }
function selected() { const current = now3(); return { mode: view.mode, key: view[view.mode] || current[view.mode], current: current[view.mode] }; }
function sameSel(a, b) { return a && b && a.mode === b.mode && a.key === b.key; }
function periodName(sel) {

function periodAnswer(sel) {

    return;
  }
  const current = sel.key === sel.current;
  await getAnswer(sel.mode === "month" ? extra.months : extra.years, keptKey(sel), { want: sel.mode, date: sel.key },
                  current ? (sel.mode === "month" ? 15 : 60) : 360);
}
async function loadPeriod(sel) {
  const id = sel.mode + " " + sel.key;
  if (view.loading === id) return;
  view.loading = id;
  try {
    await fetchPeriod(sel);
    if (sameSel(selected(), sel)) view.error = "";
  } catch (e) {
    // still the one wanted and nothing to show for it: go back to what was showing. (A failed refresh of
    // figures already on screen just leaves them there.)
    if (sameSel(selected(), sel) && !periodAnswer(sel)) {
      if (view.before) Object.assign(view, view.before);
      view.error = `Couldn't get ${periodName(sel)}: ${message(e)}.`;
    }
  }
  if (view.loading === id) view.loading = "";
  refreshCards("energy");
}
function go(change) {
  const before = { mode: view.mode, day: view.day, month: view.month, year: view.year };
  if (change.mode) { view.mode = change.mode; store("energy-mode", change.mode); }
  if (change.step) {
    const sel = selected(), key = stepKey(sel, change.step);
    if (key < FIRST[sel.mode] || key > sel.current) return;
    view[sel.mode] = key === sel.current ? "" : key;
  }
  view.before = before;
  view.error = "";
  refreshCards("energy");                                    // the new name at once; the last chart stays, dimmed, until the new one arrives
}
function forgetOldDays(keep) {
  // the 12 days fetched most recently stay in memory, plus today, the one just fetched and the one on screen
  const today = londonDate(), shown = view.day || today;
  const old = Object.keys(days.loaded).filter(k => k !== today && k !== keep && k !== shown);
  old.slice(0, Math.max(0, old.length - 12)).forEach(k => { delete days.loaded[k]; });
}

function energyModel(sel, a) {
  if (sel.mode === "day") {
    const P = a.points || {}, t = P.t || [];
    // FoxESS sometimes puts the house below zero for a few minutes on sunny days: every power is drawn as zero or more
    const col = name => t.map((_, i) => P[name] && P[name][i] != null ? Math.max(0, +P[name][i]) : null);
    return { sel, a, unit: "kW", t, span: (a.end - a.start) || 86400, start: a.start, count: t.length,
             up: { solar: col("solar"), battery: col("giving"), grid: col("buying") },
             down: { home: col("house"), battery: col("charging"), grid: col("selling") },
             level: col("battery"), roofs: [col("roof1"), col("roof2")] };
  }
  const get = (sel.mode === "month" ? a.days : a.months) || {};
  const count = sel.mode === "month" ? new Date(Date.UTC(+sel.key.slice(0, 4), +sel.key.slice(5, 7), 0)).getUTCDate() : 12;
  const today = londonDate(), rows = [];
  for (let i = 0; i < count; i++) {
    const key = `${sel.key}-${String(i + 1).padStart(2, "0")}`;            // a day of the month, or a month of the year
    const future = sel.mode === "month" ? key > today : key > today.slice(0, 7);
    rows.push(future ? null : balanceRow(get, i));
  }
  const pick = k => rows.map(r => r ? r[k] : null);
  return { sel, a, unit: "kWh", rows, count,
           up: { solar: pick("solar"), battery: pick("gave"), grid: pick("bought") },
           down: { home: pick("used"), battery: pick("charged"), grid: pick("sold") } };
}

function hiddenSeries() { return store("energy-hidden") || {}; }
function layers(m) {
  const hidden = hiddenSeries();
  return { up: IN.filter(([k]) => !hidden[k]).map(([k, name]) => [k, name, m.up[k]]),
           down: OUT.filter(([k]) => !hidden[k]).map(([k, name]) => [k, name, m.down[k]]) };
}

function energyTiles(m) {
  if (m.sel.mode === "day") {
    const t = m.a.totals || {}, money = dayMoney(m.a), isToday = m.sel.key === m.sel.current;
    const tiles = [tile("Solar made", kwh(t.solar), "kWh", "solar"), tile("House used", kwh(usedKwh(t)), "kWh", "home"),
                   tile("Bought", kwh(t.bought), "kWh", "grid"), tile("Sold", kwh(t.sold), "kWh", "grid")];
    if (money) tiles.push(tile(isToday ? "Spent so far" : "Spent", gbp(money.spent), "", "", `with the ${pence(money.standing)} daily charge`),
                          tile("Saved", gbp(money.saved), "", "", "by the solar and battery"));
    return tiles.join("");
  }
  const sum = k => m.rows.reduce((a, r) => a + (r ? r[k] : 0), 0), used = sum("used"), bought = sum("bought");
  return [tile("Solar made", kwh(sum("solar")), "kWh", "solar"), tile("House used", kwh(used), "kWh", "home"),
          tile("Bought", kwh(bought), "kWh", "grid"), tile("Sold", kwh(sum("sold")), "kWh", "grid"),
          tile("From solar", used ? Math.round(Math.max(0, used - bought) / used * 100) + "%" : "–", "", "solar", "of the house's use"),
          tile("Battery", kwh(sum("gave")), "kWh", "battery", "given to the house")].join("");
}

function energyCard() {
  if (!live.url && !live.reading) return "";
  if (live.version === 1) {
    return card("energy", "Energy", `<p class="muted">The charts need the live script's update: part 5 of the walk-through, about 3 minutes at a computer.
      Right now's figures keep working until then.</p>`);
  }
  const sel = selected(), a = periodAnswer(sel);
  if (a) view.last = energyModel(sel, a);
  if ((!a || periodStale(sel)) && !view.error) setTimeout(() => loadPeriod(sel), 0);
  const m = a ? view.last : view.last && view.last.sel.mode === sel.mode ? view.last : null;   // while loading, the last chart of the same kind, dimmed
  const asTable = store("energy-view") === "table";
  const tabs = `<div class="seg" role="group" aria-label="Period">${MODES.map(([k, name]) => `<button data-mode="${k}" aria-pressed="${k === sel.mode}">${name}</button>`).join("")}</div>`;
  const hidden = hiddenSeries();
  const nav = `<div class="period">
      <div class="period-nav">
        <button class="icon-btn" id="period-back" aria-label="Before"${stepKey(sel, -1) < FIRST[sel.mode] ? " disabled" : ""}>${icon("left")}</button>
        <span class="period-name" aria-live="polite">${esc(periodName(sel))}</span>
        <button class="icon-btn" id="period-next" aria-label="After"${sel.key >= sel.current ? " disabled" : ""}>${icon("right")}</button>
      </div>
      <div class="seg icons" role="group" aria-label="Show as">
        <button data-view="chart" aria-pressed="${!asTable}" aria-label="A chart">${icon("chart")}</button>
        <button data-view="table" aria-pressed="${asTable}" aria-label="A table">${icon("table")}</button>
      </div></div>`;
  if (!m) return card("energy", "Energy", nav + `<p class="muted">${esc(view.error || `Getting ${periodName(sel)}…`)}</p>`, tabs);
  const chips = `<div class="chips" role="group" aria-label="Show or hide">${CHIPS.map(([k, name]) =>
    `<button class="chip-key" data-series="${k}" aria-pressed="${!hidden[k]}" style="--c: var(--c-${k})"><i class="sw"></i>${name}</button>`).join("")}</div>`;
  const what = sel.mode === "day" ? "readings every 5 minutes" : sel.mode === "month" ? "each day" : "each month";
  const body = asTable ? energyTable(m)
    : chips + `<div class="ec" id="energy-chart" tabindex="0" role="group" aria-label="${esc(periodName(m.sel))}: ${what}. Use the left and right arrow keys to move along it."></div>`;
  const note = sel.mode === "day"
    ? `${asTable ? "" : "Drag across the chart to see any 5 minutes. "}Readings every 5 minutes from FoxESS; the day's totals from its meters. ${priceWords()}`
    : `${asTable ? "" : `Tap a bar to see that ${sel.mode === "month" ? "day" : "month"}. `}Totals from FoxESS's meters. House used: what came in less what went out.`;
  return card("energy", "Energy", nav + `<div class="tiles">${energyTiles(m)}</div>` + body +
    `<p class="fine" style="margin-top: 12px">${note}</p>` + (view.error ? `<p class="fine" role="status" style="margin-top: 6px">${esc(view.error)}</p>` : ""),
    tabs, a ? "" : "busy");
}

function energyTable(m) {
  if (m.sel.mode === "day") {
    const d = m.a, t = d.totals || {};
    const rows = hourRows(d).map(r => [clock(new Date((d.start + r.n * 3600) * 1000)), r.solar, r.house, r.bought, r.sold, r.charged, r.gave,
                                       r.level == null ? "–" : Math.round(r.level) + "%"]);
    return tableHtml(`${periodName(m.sel)}, kWh in each hour`, "Hour", rows,
      ["Day", num(t.solar), usedKwh(t), num(t.bought), num(t.sold), num(t.charged), num(t.gave)],
      "kWh in each hour, worked out from the 5-minute readings and scaled to FoxESS's meters for the day. Level: the battery at the end of the hour.");
  }
  const rows = [], sum = { solar: 0, used: 0, bought: 0, sold: 0, charged: 0, gave: 0 };
  m.rows.forEach((r, i) => {
    if (!r) return;
    const name = m.sel.mode === "month" ? shortDate(`${m.sel.key}-${String(i + 1).padStart(2, "0")}`)
      : new Date(Date.UTC(+m.sel.key, i, 15)).toLocaleDateString("en-GB", { month: "long", timeZone: "UTC" });
    rows.push([name, r.solar, r.used, r.bought, r.sold, r.charged, r.gave]);
    for (const k of Object.keys(sum)) sum[k] += r[k];
  });
  return tableHtml(`${periodName(m.sel)}, kWh`, m.sel.mode === "month" ? "Day" : "Month", rows,
    ["Total", sum.solar, sum.used, sum.bought, sum.sold, sum.charged, sum.gave], "kWh, from FoxESS's meters.");
}

// ---- drawing the chart (once the page knows how wide it is)
function niceStep(peak) {
  const p = Math.pow(10, Math.floor(Math.log10(peak / 4)));
  let best = null;
  for (const m of [1, 2, 5, 2.5, 4, 3, 10, 20]) {        // the nicer steps first, so they win a tie
    const step = m * p, n = Math.ceil(peak / step - 1e-9);
    if (n >= 3 && n <= 5 && (!best || n * step < best[1] - 1e-9)) best = [step, n * step];
  }
  return best ? best[0] : 10 * p;
}

function watchSize() {
  // the chart is drawn at its real width, so it's drawn again when that changes (turning a tablet). Only the
  // chart on the page now is watched: a screen left on for days would otherwise keep every old one in memory.
  if (!("ResizeObserver" in window)) return;
  if (!resizer) {
    resizer = new ResizeObserver(() => requestAnimationFrame(() => {
      const box = document.getElementById("energy-chart");
      if (box && chart && Math.abs(box.clientWidth - chart.W) > 3) drawEnergy();
    }));
  }
  resizer.disconnect();
  const box = document.getElementById("energy-chart");
  if (box) resizer.observe(box);
}

function drawEnergy() {
  const box = document.getElementById("energy-chart");
  if (!box) { chart = null; return; }
  const m = view.last, W = Math.floor(box.clientWidth);
  if (!m || W < 120) return;
  const L = layers(m), day = m.sel.mode === "day";
  if (day && m.count < 2) { box.innerHTML = `<p class="muted">No readings for this day yet.</p>`; chart = null; return; }
  const n = m.count, total = (group, i) => group.reduce((s, [, , vals]) => s + (vals[i] || 0), 0);
  let up = 0, down = 0;
  for (let i = 0; i < n; i++) { up = Math.max(up, total(L.up, i)); down = Math.max(down, total(L.down, i)); }
  const step = niceStep(Math.max(up, down, day ? 0.4 : 1));
  const top = Math.max(step, Math.ceil(up / step - 1e-9) * step), bottom = Math.max(step, Math.ceil(down / step - 1e-9) * step);
  const padL = 32, padR = 6, PT = 8, plotW = Math.max(60, W - padL - padR), H = W < 520 ? 230 : 270, k = H / (top + bottom);
  const y = v => PT + (top - v) * k, y0 = y(0);
  const slot = plotW / n;
  const x = day ? s => padL + Math.max(0, Math.min(m.span, s)) / m.span * plotW : i => padL + slot * (i + 0.5);
  let svg = "";
  // the time along the bottom: clock hours (a day), days of the month or months
  const ticks = [];
  if (day) {
    for (const h of W < 520 ? [0, 6, 12, 18, 24] : [0, 3, 6, 9, 12, 15, 18, 21, 24]) {
      const s = h * 3600 - (ukOffset(m.start + h * 3600) - ukOffset(m.start));     // two days a year are 23 or 25 hours long
      ticks.push([x(Math.min(m.span, s)), `${String(h).padStart(2, "0")}:00`]);
    }
  } else if (m.sel.mode === "month") {
    for (let i = 0; i < n; i += 7) ticks.push([x(i), String(i + 1)]);
  } else {
    for (let i = 0; i < 12; i++) ticks.push([x(i), new Date(Date.UTC(2026, i, 15)).toLocaleDateString("en-GB", { month: "narrow", timeZone: "UTC" })]);
  }
  for (let v = -bottom; v <= top + 1e-9; v += step) {
    const yy = f1(y(v));
    svg += `<line class="${Math.abs(v) < 1e-9 ? "zero" : "gl"}" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>` +
           `<text class="tick" x="${padL - 6}" y="${f1(y(v) + 3.5)}" text-anchor="end">${Math.round(Math.abs(v) * 100) / 100}</text>`;
  }
  if (day) svg += ticks.map(([tx]) => `<line class="gl" x1="${f1(tx)}" x2="${f1(tx)}" y1="${PT}" y2="${f1(PT + H)}"/>`).join("");
  svg += `<text class="dir" x="${padL + 6}" y="${PT + 13}">Coming in</text><text class="dir" x="${padL + 6}" y="${f1(PT + H - 6)}">Going out</text>`;
  // the stacks: outward from the line, in the order of the legend
  if (day) {
    const runs = [];                                        // stretches with readings, broken where one is missing or 20 minutes apart
    let run = [];
    for (let i = 0; i < n; i++) {
      const missing = [...Object.values(m.up), ...Object.values(m.down)].every(a => a[i] == null);
      if (missing || (i && m.t[i] - m.t[i - 1] > 1200)) { if (run.length > 1) runs.push(run); run = []; }
      if (!missing) run.push(i);
    }
    if (run.length > 1) runs.push(run);
    for (const [group, sign] of [[L.up, 1], [L.down, -1]]) {
      const base = new Array(n).fill(0);
      for (const [key, , vals] of group) {
        let area = "", edge = "";
        for (const r of runs) {
          const outer = r.map(i => [x(m.t[i]), y(sign * (base[i] + (vals[i] || 0)))]);
          const inner = r.map(i => [x(m.t[i]), y(sign * base[i])]).reverse();
          area += "M" + outer.concat(inner).map(xy).join("L") + "Z";
          edge += "M" + outer.map(xy).join("L");
        }
        svg += `<path class="st-area" d="${area}" style="fill: var(--c-${key})"/><path class="st-edge" d="${edge}" style="stroke: var(--c-${key})"/>`;
        for (let i = 0; i < n; i++) base[i] += vals[i] || 0;
      }
    }
  } else {
    const bw = Math.max(3, Math.min(24, slot * 0.64)), r = Math.min(3, bw / 3);
    const piece = (cx, from, to, round) => {                // from the line outwards; a 2px gap between pieces; the outer end rounded
      const lo = Math.min(from, to), hi = Math.max(from, to), h = hi - lo;
      if (h < 0.4) return "";
      const x0 = cx - bw / 2, rr = round ? Math.min(r, h) : 0;
      if (to < from) return `M${f1(x0)},${f1(hi)}V${f1(lo + rr)}q0,${f1(-rr)} ${f1(rr)},${f1(-rr)}h${f1(bw - 2 * rr)}q${f1(rr)},0 ${f1(rr)},${f1(rr)}V${f1(hi)}Z`;
      return `M${f1(x0)},${f1(lo)}V${f1(hi - rr)}q0,${f1(rr)} ${f1(rr)},${f1(rr)}h${f1(bw - 2 * rr)}q${f1(rr)},0 ${f1(rr)},${f1(-rr)}V${f1(lo)}Z`;
    };
    for (let i = 0; i < n; i++) {
      if (!m.rows[i]) continue;
      for (const [group, sign] of [[L.up, 1], [L.down, -1]]) {
        const shown = group.filter(([, , vals]) => (vals[i] || 0) > 0);
        let base = 0;
        shown.forEach(([key, , vals], j) => {
          const v = vals[i], from = y(sign * base) - sign * (j ? 1 : 0), to = y(sign * (base + v)) + sign * (j < shown.length - 1 ? 1 : 0);
          svg += `<path class="st-bar" d="${piece(x(i), from, to, j === shown.length - 1)}" style="fill: var(--c-${key})"/>`;
          base += v;
        });
      }
    }
  }
  const axis = ticks.map(([tx, label], i) => `<text class="tick" x="${f1(tx)}" y="${f1(PT + H + 15)}" text-anchor="${day ? (i === 0 ? "start" : i === ticks.length - 1 ? "end" : "middle") : "middle"}">${label}</text>`).join("");
  const mainH = PT + H + 20;
  let html = `<svg class="plot" id="energy-main" width="${W}" height="${mainH}" viewBox="0 0 ${W} ${mainH}" role="img"
      aria-label="${esc(`${periodName(m.sel)}: coming in above the line (${L.up.map(l => l[1].toLowerCase()).join(", ")}), going out below it (${L.down.map(l => l[1].toLowerCase()).join(", ")}).`)}">${svg}${axis}<g class="hover"></g></svg>`;
  // a day also has the battery's level, as its own small chart (one scale per chart)
  let levelY = null;
  if (day) {
    const LH = 64, LT = 6;
    levelY = v => LT + (100 - v) / 100 * LH;
    let ls = "";
    for (const v of [0, 50, 100]) ls += `<line class="gl" x1="${padL}" x2="${W - padR}" y1="${f1(levelY(v))}" y2="${f1(levelY(v))}"/><text class="tick" x="${padL - 6}" y="${f1(levelY(v) + 3.5)}" text-anchor="end">${v}</text>`;
    let line = "", run = [];
    const flush = () => { if (run.length > 1) line += "M" + run.join("L"); run = []; };
    m.level.forEach((v, i) => { if (v == null || (i && m.t[i] - m.t[i - 1] > 1200)) flush(); if (v != null) run.push(xy([x(m.t[i]), levelY(v)])); });
    flush();
    html += `<div class="panel-head"><span class="panel-title">Battery level<small>%</small></span></div>
      <svg class="plot" id="energy-level" width="${W}" height="${LH + LT + 6}" viewBox="0 0 ${W} ${LH + LT + 6}" role="img" aria-label="The battery's level through the day">
      ${ls}<path class="ln" d="${line}" style="stroke: var(--c-battery)"/><g class="hover"></g></svg>`;
  }
  box.innerHTML = html + `<div class="tip" id="energy-tip" hidden></div>`;
  chart = { m, W, n, x, y, H, PT, padL, plotW, slot, day, L, levelY, focus: null,
            last: day ? (() => { for (let i = n - 1; i >= 0; i--) if (m.down.home[i] != null || m.up.solar[i] != null) return i; return n - 1; })()
                      : (() => { for (let i = n - 1; i >= 0; i--) if (m.rows[i]) return i; return 0; })() };
  watchSize();
  wireChart(box);
}

function showTip(i) {
  const c = chart, tip = document.getElementById("energy-tip");
  if (!c || !tip) return;
  const main = document.querySelector("#energy-main .hover"), level = document.querySelector("#energy-level .hover");
  if (i == null) { tip.hidden = true; if (main) main.innerHTML = ""; if (level) level.innerHTML = ""; c.focus = null; return; }
  const m = c.m, cx = c.day ? c.x(m.t[i]) : c.x(i);
  if (main) main.innerHTML = c.day ? `<line class="cross" x1="${f1(cx)}" x2="${f1(cx)}" y1="${c.PT}" y2="${f1(c.PT + c.H)}"/>`
                                   : `<rect class="picked" x="${f1(cx - c.slot / 2)}" y="${c.PT}" width="${f1(c.slot)}" height="${c.H}"/>`;
  if (level) level.innerHTML = m.level[i] == null ? "" : `<line class="cross" x1="${f1(cx)}" x2="${f1(cx)}" y1="0" y2="80"/>` +
    `<circle class="end" cx="${f1(cx)}" cy="${f1(c.levelY(m.level[i]))}" r="4" style="fill: var(--c-battery)"/>`;
  const fmt = v => v == null ? "–" : c.day ? `${kw(v)} kW` : `${kwh(v)} kWh`;
  const when = c.day ? clock(new Date((m.start + m.t[i]) * 1000))
    : m.sel.mode === "month" ? shortDate(`${m.sel.key}-${String(i + 1).padStart(2, "0")}`)
    : new Date(Date.UTC(+m.sel.key, i, 15)).toLocaleDateString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });
  const row = (key, name, v) => `<div class="tip-row"><i class="sw" style="--c: var(--c-${key})"></i><span>${name}</span><b>${fmt(v)}</b></div>`;
  tip.innerHTML = `<div class="tip-time">${esc(when)}</div>` + IN.map(([k, name]) => row(k, name, m.up[k][i])).join("") +
    `<div class="tip-gap"></div>` + OUT.map(([k, name]) => row(k, name, m.down[k][i])).join("") +
    (c.day && m.level[i] != null ? `<div class="tip-gap"></div><div class="tip-row"><i class="sw" style="--c: var(--c-battery)"></i><span>Battery level</span><b>${Math.round(m.level[i])}%</b></div>` : "");
  tip.hidden = false;
  const box = document.getElementById("energy-chart"), w = tip.offsetWidth;
  const left = cx > c.padL + c.plotW / 2 ? cx - w - 12 : cx + 12;
  tip.style.left = Math.max(0, Math.min(box.clientWidth - w, left)) + "px";
  c.focus = i;
}

function nearest(t, s) {
  let a = 0, b = t.length - 1;
  while (b - a > 1) { const mid = (a + b) >> 1; if (t[mid] < s) a = mid; else b = mid; }
  return Math.abs(t[a] - s) <= Math.abs(t[b] - s) ? a : b;
}

function wireChart(box) {
  let timer = null;
  const pick = e => {
    const c = chart, plot = document.getElementById("energy-main");
    if (!c || !plot) return;
    const px = e.clientX - plot.getBoundingClientRect().left - c.padL;
    if (c.day) showTip(Math.min(c.last, nearest(c.m.t, px / c.plotW * c.m.span)));
    else { const i = Math.floor(px / c.slot); if (i >= 0 && i < c.n && c.m.rows[i]) showTip(i); }
  };
  box.onpointerdown = e => { clearTimeout(timer); pick(e); };
  box.onpointermove = e => { if (e.pointerType !== "pen" || e.pressure > 0) pick(e); };   // touch moves only come while touching
  box.onpointerleave = e => { if (e.pointerType === "mouse") showTip(null); };
  box.onpointerup = box.onpointercancel = e => { if (e.pointerType !== "mouse") { clearTimeout(timer); timer = setTimeout(() => showTip(null), 4000); } };
  box.onkeydown = e => {
    const c = chart;
    if (!c) return;
    const moves = { ArrowLeft: -1, ArrowRight: 1, PageUp: -12, PageDown: 12 };
    let k = c.focus == null ? c.last : c.focus;
    if (e.key in moves) k += moves[e.key] * (e.shiftKey ? 12 : 1);
    else if (e.key === "Home") k = 0;
    else if (e.key === "End") k = c.last;
    else if (e.key === "Escape") { showTip(null); return; }
    else return;
    e.preventDefault();
    k = Math.max(0, Math.min(c.last, k));
    if (!c.day) while (k > 0 && !c.m.rows[k]) k--;
    showTip(k);
  };
  box.onblur = () => showTip(null);
}

function wireEnergy() {
  document.querySelectorAll("button[data-mode]").forEach(b => b.onclick = () => go({ mode: b.dataset.mode }));
  document.querySelectorAll("button[data-view]").forEach(b => b.onclick = () => { store("energy-view", b.dataset.view); refreshCards("energy"); });
  document.querySelectorAll("button[data-series]").forEach(b => b.onclick = () => {
    const hidden = hiddenSeries();
    if (hidden[b.dataset.series]) delete hidden[b.dataset.series]; else hidden[b.dataset.series] = 1;
    if (CHIPS.every(([k]) => hidden[k])) return;              // keep at least one
    store("energy-hidden", hidden);
    refreshCards("energy");
  });
  const back = document.getElementById("period-back"), next = document.getElementById("period-next");
  if (back) back.onclick = () => go({ step: -1 });
  if (next) next.onclick = () => go({ step: 1 });
}

// ---- the best times to use power
function bestTimesCard(plan) {
  if (!plan || !plan.days) return card("best", "Best times to use power", `<p class="muted">No forecast yet.</p>`);
  const today = londonDate(), hourNow = +clock(new Date()).slice(0, 2);
  const block = day => {
    const byHour = Object.fromEntries((day.hours || []).map(h => [h.hour.slice(0, 2), h]));
    const cells = [], labels = [];
    for (let h = 6; h < 24; h++) {
      const key = String(h).padStart(2, "0"), hour = byHour[key];
      const cls = (hour ? hour.rating : "past") + (day.date === today && h === hourNow ? " now" : "");
      const tip = hour ? `${key}:00, ${hour.rating}: about ${Math.round(hour.pence)}p a unit, solar ${hour.solar_kwh} kWh` : `${key}:00, gone`;
      cells.push(`<span class="${esc(cls)}" title="${esc(tip)}"></span>`);
      labels.push(`<span>${h % 3 === 0 ? key : ""}</span>`);
    }
    return `<div class="bt-day"><div class="bt-head"><span class="bt-name">${esc(day.label)}</span>
        <span class="fine">Solar forecast about ${kwh(day.solar_kwh)} kWh${day.spare_kwh ? `, about ${kwh(day.spare_kwh)} kWh spare` : ""}</span></div>
      <p class="bt-text">${esc(day.text)}</p>
      <div class="strip" role="img" aria-label="${esc(`${day.label}, hour by hour from 6am: ${(day.hours || []).map(h => `${h.hour} ${h.rating}`).join(", ") || "no hours left"}`)}">${cells.join("")}</div>
      <div class="hours" aria-hidden="true">${labels.join("")}</div></div>`;
  };
  const tonight = plan.battery_tonight && plan.battery_tonight.text
    ? `<div class="bt-day"><div class="bt-head"><span class="bt-name">Battery tonight</span></div><p class="bt-text">${esc(plan.battery_tonight.text)}</p>
       <p class="fine" style="margin-top: 4px">A suggestion only: nothing is changed on the inverter.</p></div>` : "";
  return card("best", "Best times to use power", plan.days.map(block).join("") + tonight +
    `<ul class="keys" style="margin-top: 12px"><li><i class="sw" style="--c: var(--good)"></i>Best: spare solar</li>
      <li><i class="sw" style="--c: var(--good-soft)"></i>Good: partly solar or a cheaper rate</li><li><i class="sw" style="--c: var(--cell)"></i>Normal price</li></ul>
    <p class="fine" style="margin-top: 8px">For the washing machine, dishwasher and other big things. Worked out ${esc(when(plan.made || ""))}.</p>`);
}

const KINDS = { problem: ["alert", "var(--critical)", "Problem"], money: ["pound", "var(--good)", "Money"], watch: ["eye", "var(--warning)", "Keep an eye on"],
                reminder: ["bell", "", "Reminder"] };
function alertsCard(alerts) {

// ---- the tariff and the shower
function tariffCard(t) {
  if (!t) return "";
  const rows = [];
  if (t.now_gbp_a_year) rows.push({ name: `Now: ${t.import}`, sub: "", gbp: t.now_gbp_a_year, now: true });
  (t.options || []).forEach(o => rows.push({ name: o.import, gbp: o.gbp_a_year,
    sub: `with ${o.export}${o.fixed_months ? `; fixed ${o.fixed_months} months` : ""}${o.exit_fee_gbp ? `, £${o.exit_fee_gbp} to leave` : ""}` }));
  const caveat = t.whole_market ? "Every tariff on the market was compared."
    : "Not a recommendation yet: some tariffs couldn't be priced, so the whole market isn't compared.";
  if (!rows.length) return card("tariff", "Tariff", `<p class="lead">${esc(t.import)}</p><p class="fine">${esc(caveat)}</p>`);
  const max = Math.max(...rows.map(r => r.gbp)), cheapest = Math.min(...rows.filter(r => !r.now).map(r => r.gbp));
  const headline = t.now_gbp_a_year && isFinite(cheapest) && cheapest < t.now_gbp_a_year
    ? `<p class="headline">The cheapest option found costs about £${(t.now_gbp_a_year - cheapest).toLocaleString("en-GB")} a year less</p>` : "";
  return card("tariff", "Tariff", headline + `<div class="tbars">${rows.map(r => `<div>
      <div class="tb-name">${esc(r.name)}</div>${r.sub ? `<div class="tb-sub">${esc(r.sub)}</div>` : ""}
      <div class="tb-row"><div class="tb-track"><div class="tb-fill${r.now ? " now" : ""}" style="width: ${(r.gbp / max * 100).toFixed(1)}%"></div></div>
        <span class="tb-val">£${r.gbp.toLocaleString("en-GB")}<span class="fine"> a year</span></span></div></div>`).join("")}</div>
    <p class="fine" style="margin-top: 12px">${esc(caveat)}${t.compared ? ` Compared ${esc(t.compared)}.` : ""}${t.contract_end ? ` Contract ends ${esc(t.contract_end)}.` : ""}</p>`);
}

function showerCard(s) {
  if (!s || !s.rates || !s.rates.length) return "";
  const first = s.rates[0];
  return card("shower", "The shower", `<p class="big-figure">${first.p_per_minute.toFixed(1)}p<small>a minute${s.rates.length > 1 ? `, ${esc(first.label)}` : ""}</small></p>
    <p class="muted" style="margin-top: 6px">${s.rates.map(r => `${r.label === "all day" ? "" : esc(r.label) + ": "}10 minutes costs about ${Math.round(r.p_per_minute * 10)}p`).join(" · ")}.</p>
    <p class="fine" style="margin-top: 8px">About ${esc(s.kw)} kW, at ${s.rates.map(r => r.p_per_unit.toFixed(2) + "p").join(" or ")} a unit. Cheaper when there's spare solar.</p>`);

// ---- the live figures
async function liveUrl(source) {
  // the live link is written to the private figures repository (GitHub's LIVE_URL secret, or saved there directly)
  const saved = store("live-url");
  // a found link is checked again every 6 hours; until there is one, every 10 minutes
  if (saved && Date.now() - saved.at < (saved.url ? 6 * 3600 : 600) * 1000) return saved.url;
  let url = "";
  try {
    const response = source ? await github(source, "live.json", { headers: { Accept: "application/vnd.github.raw+json" } })
                            : await fetch("live.json", { cache: "no-store" });
    if (response.ok) url = String(((await response.json()) || {}).url || "");
    else if (response.status !== 404) throw new Error(`GitHub answered ${response.status}`);
  } catch (e) { return saved ? saved.url : ""; }
  if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) url = "";     // only the house's own Google script
  store("live-url", { url, at: Date.now() });
  return url;
}

async function ask(params) {
  const url = live.url + (live.url.includes("?") ? "&" : "?") + new URLSearchParams(params);
  const response = await fetch(url, { cache: "no-store" });
  const answer = await response.json();
  if (!answer || !answer.ok) throw new Error((answer && answer.error) || `the live link answered ${response.status}`);
  return answer;
}

async function refreshLive(force) {
  if (!force && (document.hidden || Date.now() - live.asked < 60 * 1000)) return;
  const source = store(SOURCE_KEY);
  if (NEEDS_KEY && !(source && source.key)) return;          // this device isn't set up yet
  live.asked = Date.now();
  const version = live.version;
  live.url = await liveUrl(source && source.key ? source : null);
  if (!live.url) { live.reading = null; store("live-last", null); refreshCards("now", "energy"); return; }
  try {
    const answer = await ask({ want: "day" });
    if (answer.version >= 2) {
      live.version = answer.version;
      days.loaded[answer.date] = answer;
      forgetOldDays(answer.date);
      if (view.mode === "day" && !view.day) view.error = "";
      store("day-last", answer);
      if (answer.now) { live.reading = answer.now; store("live-last", answer.now); }
    } else {                                                  // the first version of the script: just the latest reading
      live.version = 1;
      live.reading = answer;
      store("live-last", answer);
    }
    live.error = "";
  } catch (e) {
    live.error = `Couldn't get a new reading: ${message(e)}.`;
  }
  refreshCards("now", "energy");
}

async function keepAwake(on) {
  try {
    if (on && !wakeLock && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

// ---- alerts (web push): the device's sign-up is saved in the private repository, where the daily job reads it
function b64uToBytes(text) {
  const pad = "=".repeat((4 - text.length % 4) % 4);
  const raw = atob((text + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

function deviceId() {
  let id = store("device-id");
  if (!id) { id = "device-" + Math.random().toString(36).slice(2, 10); store("device-id", id); }
  return id;
}

async function github(source, path, options = {}) {
  const headers = Object.assign({ Authorization: `Bearer ${source.key}`, "X-GitHub-Api-Version": "2022-11-28" }, options.headers || {});
  return fetch(`https://api.github.com/repos/${source.repo}/contents/${path}`, Object.assign({}, options, { headers, cache: "no-store" }));
}

async function saveSignUp(source, subscription) {
  const path = `subscriptions/${deviceId()}.json`;
  const body = Object.assign(subscription.toJSON(), { device: deviceId(), saved: new Date().toISOString() });
  const existing = await github(source, path);
  const sha = existing.ok ? (await existing.json()).sha : undefined;
  const response = await github(source, path, { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Alert sign-up from ${deviceId()}`, content: btoa(JSON.stringify(body, null, 1)), sha }) });
  if (!response.ok) throw new Error(`GitHub said ${response.status} when saving the sign-up (does the key allow writing?)`);
  store("signup-saved", { endpoint: subscription.endpoint, at: Date.now() });
}

async function alertKey(source) {
  // the public half of the alert key, written to the private repository by the daily job
  const response = await github(source, "push/vapid-public-key.txt", { headers: { Accept: "application/vnd.github.raw+json" } });
  return response.ok ? (await response.text()).trim() : "";
}

function sameKey(subscription, key) {
  const current = subscription.options && subscription.options.applicationServerKey;
  if (!current || !key) return true;                      // can't tell, so leave it
  const a = new Uint8Array(current), b = b64uToBytes(key);
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

async function lastAlert() {
  try {
    const cached = await (await caches.open("home-energy-data")).match("last-alert");
    if (cached) { const a = await cached.json(); return ` Last alert ${new Date(a.at).toLocaleString("en-GB")}.`; }
  } catch (e) {}
  return "";
}

async function showAlertsStatus(source) {
  const box = document.getElementById("alerts-status");
  if (!box) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    box.textContent = "Alerts: on an iPad or iPhone they work in the app opened from the Home Screen (Share → Add to Home Screen).";
    return;
  }
  // the app's background helper (sw.js) receives the alerts; give it a few seconds to start
  const registration = await Promise.race([navigator.serviceWorker.ready, new Promise(done => setTimeout(() => done(null), 8000))]);
  if (!box.isConnected) return;                             // the footer was redrawn meanwhile: that one does its own
  if (!registration) { box.textContent = "Alerts: the app's background helper hasn't started. Close the app fully and open it again."; return; }
  let subscription = await registration.pushManager.getSubscription();
  const key = await alertKey(source).catch(() => "");
  if (!box.isConnected) return;
  if (subscription && key && !sameKey(subscription, key)) {        // the alert key was changed: sign up again
    await subscription.unsubscribe().catch(() => {});
    subscription = null;
  }
  if (subscription && Notification.permission === "granted") {
    box.textContent = "Alerts: on." + await lastAlert();
    // the sign-up can change without warning: save it again when it does, and weekly
    const saved = store("signup-saved") || {};
    if (saved.endpoint !== subscription.endpoint || Date.now() - (saved.at || 0) > 7 * 24 * 3600 * 1000) {
      saveSignUp(source, subscription).catch(e => { box.textContent = "Alerts: on, but " + e.message; });
    }
    return;
  }
  if (!key) { box.textContent = "Alerts: not ready yet. They start once the alert key is saved in GitHub and the daily update has run."; return; }
  if (Notification.permission === "denied") { box.textContent = "Alerts: blocked on this device. Settings → Notifications → Energy turns them on."; return; }
  box.innerHTML = `Alerts: off. <button class="link-btn" id="alerts-on">Turn on alerts</button>`;
  box.querySelector("#alerts-on").onclick = () => {
    // asked straight from the tap: Safari only shows the question in direct response to one
    Notification.requestPermission()
      .then(permission => {
        if (permission !== "granted") throw new Error("not allowed. Settings → Notifications → Energy turns them on.");
        return registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(key) });
      })
      .then(sub => saveSignUp(source, sub))
      .then(() => { box.textContent = "Alerts: on. New alerts arrive with the morning update."; })
      .catch(e => { box.textContent = "Alerts: " + (e.message || e); });
  };
}

// ---- setting up a device: its key is pasted once and kept on that device only
class SetupError extends Error {
  constructor(text, keep) { super(text); this.keep = !!keep; }
}

function forgetSource() { try { localStorage.removeItem(SOURCE_KEY); } catch (e) {} }

    const status = document.getElementById("setup-status");
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { status.textContent = "The repository should look like owner/name."; return; }
    if (key.startsWith("ghp_")) { status.textContent = "That's a classic key, which can see every repository. Make a fine-grained one (the walk-through's link)."; return; }
    if (!/^github_pat_\w{20,}$/.test(key)) { status.textContent = "That doesn't look like a GitHub key: they start github_pat_."; return; }
    store(SOURCE_KEY, { repo, key, checked: 0 });
    status.textContent = "Checking the key…";
    load();
  };
}

async function privateSource() {
  const source = store(SOURCE_KEY);
  if (!source || !source.repo || !source.key) return null;
  const headers = { Authorization: `Bearer ${source.key}`, "X-GitHub-Api-Version": "2022-11-28" };
  if (Date.now() - (source.checked || 0) > 24 * 3600 * 1000) {
    // refuse a key that can also open the playbook: it should only see the energy figures
    const probe = await fetch(`https://api.github.com/repos/${PLAYBOOK}`, { headers, cache: "no-store" });
    if (probe.ok) {
      forgetSource();
      throw new SetupError("That key can also see the owner's private playbook, so it was refused and forgotten. Make a key that can only see the energy figures.");
    }
    if (probe.status === 401) {
      forgetSource();
      throw new SetupError("GitHub didn't accept that key: it may be mistyped, expired or deleted. Paste a new one.");
    }
    const own = await fetch(`https://api.github.com/repos/${source.repo}`, { headers, cache: "no-store" });
    if (own.status === 404) {
      forgetSource();
      throw new SetupError(`That key can't see ${source.repo}. Check the name, or make the key again with that repository picked.`);
    }
    if (!own.ok) throw new Error(`GitHub answered ${own.status}`);    // e.g. no internet: try again later
    source.checked = Date.now();
    store(SOURCE_KEY, source);
  }
  return { repo: source.repo, url: `https://api.github.com/repos/${source.repo}/contents/app-data.json`,
           headers: Object.assign({ Accept: "application/vnd.github.raw+json" }, headers) };
}

async function load() {
  try {
    const source = await privateSource();
    if (!source && NEEDS_KEY) { showSetup(); return; }
    const response = source ? await fetch(source.url, { headers: source.headers, cache: "no-store" })
                            : await fetch(DATA_URL, { cache: "no-store" });
    if (source && response.status === 404) {
      throw new SetupError(`The key works, but there are no figures in ${source.repo} yet. They appear after the daily update has run.`, true);
    }
    if (!response.ok) throw new Error(`the figures couldn't be fetched (${response.status})`);
    daily = await response.json();
    dailyStale = false;
    store("last-data", daily);
    document.getElementById("main").innerHTML = "";              // leaves a finished set-up card behind
    render();
  } catch (error) {
    if (error instanceof SetupError) { showSetup(error.message, error.keep); return; }
    const last = store("last-data");
    if (last) { daily = last; dailyStale = true; render(); }
    else document.getElementById("main").innerHTML = `<section class="card wide"><p class="lead">Couldn't load the figures.</p><p class="muted">${esc(error.message || error)}</p></section>`;
  }
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load().then(() => refreshLive(true));
// refresh every half hour and on coming back to the app, but never while a key is being pasted
function refresh() { if (!document.getElementById("setup-key")) load(); }
setInterval(refresh, 30 * 60 * 1000);
setInterval(() => refreshLive(), LIVE_EVERY);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  refresh();
  refreshLive();
  if (store("keep-awake")) keepAwake(true);                  // the screen lock is let go whenever the app is hidden
});
if (store("keep-awake")) keepAwake(true);
</script>
</body>
</html>
